function submitUpdateAccess(ev, id){
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  const reason = f.reason; delete f.reason;
  if(!f.reportingManagerId) f.reportingManagerId = null;
  return withRequest('update-access', ()=>updateUserAccess(id, f, reason));
}
function submitModuleAccess(ev, id){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const modules = MODULE_LIST.filter(m=>fd.get("mod_"+m.key)).map(m=>m.key);
  return withRequest('module-access', ()=>setStaffModuleAccess(id, modules));
}

/* ==================== ACCOUNTANT DASHBOARD — cash, P&L, reconciliation, tax ==================== */
function renderAccountantDashboard(){
  const meRaw = DB.me;
  if(!meRaw) return `<div class="empty">No accountant profile found.</div>`;
  const me = { name: meRaw.name, leaveDays: meRaw.leave_days_balance ?? 0 };
  const st = computeStats(null);

  // Real cash position — from the authoritative backend endpoint, not
  // re-derived here. See loadCoreData(): the previous local computation
  // used the OPPOSITE debit/credit sign convention from the backend AND
  // capitalized account ids ("Cash") that never matched the real lowercase
  // ids ('cash') — meaning every figure below was either backwards or
  // silently zero. DB.cashPosition is the single, correct source now.
  const cp = DB.cashPosition || {};
  const cashAtHand = cp.cash || 0, bankBalance = cp.bank || 0, mpesaBalance = cp.mpesa || 0;
  const totalLiquid = cashAtHand + bankBalance + mpesaBalance;

  const interestIncomeMTD = DB.payments.filter(p=>p.status!=="Unposted" && isThisMonth(p.date)).reduce((s,p)=>s+(p.allocated.interest||0),0);
  const expensesMTD = DB.expenses.filter(e=>isThisMonth(e.date)).reduce((s,e)=>s+e.amount,0);
  const netProfitMTD = interestIncomeMTD - expensesMTD;
  const collectionsMTD = DB.payments.filter(p=>p.status!=="Unposted" && isThisMonth(p.date)).reduce((s,p)=>s+p.amount,0);
  const expected30 = activeLoans().flatMap(l=>l.schedule).filter(r=>r.status!=="Paid" && r.dueDate && daysBetween(todayISO(),r.dueDate)>=0 && daysBetween(todayISO(),r.dueDate)<=30).reduce((s,r)=>s+Math.max(0,r.totalDue-(r.paidAmount||0)),0);
  const undisbursed = DB.loans.filter(l=>l.status==="Approved for Disbursement").reduce((s,l)=>s+l.principal,0);

  const principalDisbursed = DB.loans.filter(l=>l.disbursedAt).reduce((s,l)=>s+l.principal,0);
  const principalCollected = DB.payments.filter(p=>p.status!=="Unposted").reduce((s,p)=>s+(p.allocated.principal||0),0);
  const outstandingPrincipal = activeLoans().reduce((s,l)=>s+loanOutstandingPrincipal(l),0);
  const interestCollectedAll = DB.payments.filter(p=>p.status!=="Unposted").reduce((s,p)=>s+(p.allocated.interest||0),0);
  const writtenOff = DB.loans.filter(l=>l.status==="Written Off");
  const writtenOffAmt = writtenOff.reduce((s,l)=>s+l.principal,0);
  const provisionBuckets = [
    {label:"1–30 days", days:1, rate:0.10}, {label:"31–60 days", days:31, rate:0.25},
    {label:"61–90 days", days:61, rate:0.50}, {label:"90+ days", days:91, rate:1.00},
  ];
  const provisionRows = provisionBuckets.map((b,i)=>{
    const nextMin = provisionBuckets[i+1]?.days ?? Infinity;
    const bal = activeLoans().filter(l=>{const d=loanArrearsDays(l); return d>=b.days && d<nextMin;}).reduce((s,l)=>s+loanBalance(l),0);
    return {...b, bal, provision: bal*b.rate};
  });
  const totalProvision = provisionRows.reduce((s,r)=>s+r.provision,0);

  const expByCategory = {};
  DB.expenses.forEach(e=>{ expByCategory[e.category]=(expByCategory[e.category]||0)+e.amount; });

  // Real daily net-cash-movement trend — same debit-increases-asset
  // convention as the backend, filtered to the real lowercase account ids.
  const cashFlowPoints = disbursementTrendPoints(DB.loans).map((p,i)=>{
    const day = i+1;
    const dayStr = todayISO().slice(0,8)+String(day).padStart(2,'0');
    const dayTxns = DB.transactions.filter(t=>['cash','bank','mpesa'].includes(t.account) && t.date && t.date.slice(0,10)===dayStr);
    const net = dayTxns.reduce((s,t)=>s+t.debit-t.credit,0);
    return {label:p.label, value: net};
  });

  // The Accountant is the final workflow stage before disbursement.
  const waitingQueue = DB.loans.filter(l=>l.status==="Waiting for Accountant");

  // Real "today's payment processing" progress — the Accountant-appropriate
  // equivalent of the Loan Officer's daily collection bar (per the actual
  // job: validating/posting payments already recorded, not collecting them).
  const today = todayISO();
  const todaysPayments = DB.payments.filter(p=>p.date && p.date.slice(0,10)===today);
  const todaysProcessed = todaysPayments.filter(p=>p.status!=="Unposted").reduce((s,p)=>s+p.amount,0);
  const todaysPending = todaysPayments.filter(p=>p.status==="Unposted").reduce((s,p)=>s+p.amount,0);
  const todaysTotal = todaysProcessed + todaysPending;
  const processingRate = todaysTotal>0 ? (todaysProcessed/todaysTotal*100) : 100;

  const unpostedList = DB.payments.filter(p=>p.status==='Unposted');
  const overpaymentList = DB.payments.filter(p=>p.status==='Overpayment');

  return `
    <div class="card">
      <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start;">
        <div style="width:96px; height:96px; border-radius:10px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; flex-shrink:0;">${me.name.split(" ").map(w=>w[0]).join("").slice(0,2)}</div>
        <div style="flex:1; min-width:220px;">
          <div style="font-size:19px; font-weight:800; color:var(--navy);">${escapeHtml(me.name)}</div>
          <div style="display:flex; flex-direction:column; gap:6px; margin-top:8px; font-size:13px; color:var(--ink-soft);">
            <div>💼 Accountant</div>
            <div>🌍 Organization-wide Financial Scope</div>
            <div>🏖️ ${me.leaveDays} Leave Days</div>
            <div>👁️ Accounting &amp; Financial Access</div>
          </div>
          <div style="margin-top:10px;"><a onclick="openModal('apply-leave')" style="color:var(--navy); font-weight:700; font-size:12.5px; cursor:pointer;">Apply Leave</a> &nbsp;|&nbsp;
          <a onclick="openModal('request-advance')" style="color:var(--navy); font-weight:700; font-size:12.5px; cursor:pointer;">Request Advance</a></div>
        </div>
      </div>
      <div class="pill-row" style="margin-top:16px;">
        <button class="btn btn-outline btn-sm" onclick="goTo('payments','Unposted Payments')">Validate Payments</button>
        <button class="btn btn-outline btn-sm" onclick="goTo('loanbook','Loan Applications')">Review Loan Approvals</button>
        <button class="btn btn-outline btn-sm" onclick="goTo('payments','Unposted Payments')">Reconcile</button>
        <button class="btn btn-outline btn-sm" onclick="goTo('accounting','Trial Balance')">Financial Reports</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Today's Payment Processing</div>
      ${progressBar(processingRate)}
      <div class="hint" style="margin-top:6px;">${fmt(todaysProcessed)} processed of ${fmt(todaysTotal)} recorded today (${todaysPending>0?`${fmt(todaysPending)} still unposted`:'nothing pending'})</div>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Cash at Hand</div><div class="kpi-value">${fmt(cashAtHand)}</div></div>
      <div class="kpi"><div class="kpi-label">Bank Balance</div><div class="kpi-value">${fmt(bankBalance)}</div></div>
      <div class="kpi"><div class="kpi-label">M-Pesa Balance</div><div class="kpi-value">${fmt(mpesaBalance)}</div></div>
      <div class="kpi"><div class="kpi-label">Total Loan Receivables</div><div class="kpi-value">${fmt(st.portfolioOutstanding)}</div></div>
      <div class="kpi"><div class="kpi-label">Collections (MTD)</div><div class="kpi-value">${fmt(collectionsMTD)}</div></div>

      <div class="kpi"><div class="kpi-label">Net Profit (MTD)</div><div class="kpi-value" style="color:${netProfitMTD>=0?'var(--green)':'var(--red)'};">${fmt(netProfitMTD)}</div></div>
    </div>

    <div class="card">

      <div class="table-wrap"><table><tr><th>Client</th><th>Branch</th><th>Product</th><th>Principal</th><th>Submitted</th><th></th></tr>
      ${waitingQueue.map(l=>`<tr><td>${clientName(l.clientId)}</td><td>${branchName(l.branchId)}</td><td>${l.productName}</td><td>${fmt(l.principal)}</td><td>${new Date(l.createdAt).toLocaleDateString()}</td>
        <td><button class="btn btn-sm btn-outline" onclick="openLoan('${l.id}')">Review</button></td></tr>`).join("") || `<tr><td colspan="6" class="empty">Nothing waiting for Accountant approval right now.</td></tr>`}</table></div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-title">Cash Position</div>
        <table>

function submitTaxObligation(ev){ ev.preventDefault(); const f=Object.fromEntries(new FormData(ev.target)); addTaxObligation(f); renderApp(); return false; }

/* ==================== CEO DASHBOARD — executive business performance ==================== */
function renderCEODashboard(){
  const meRaw = DB.me;
  if(!meRaw) return `<div class="empty">No CEO profile found.</div>`;
  const me = { name: meRaw.name, leaveDays: meRaw.leave_days_balance ?? 0 };
  const st = computeStats(null);
  const periods = {today:1, week:7, month:30, quarter:90, year:365};
  const period = session.ceoPeriod || "month";
  const sinceDate = addDays(todayISO(), -periods[period]);
  const inPeriod = d => d && d.slice(0,10) >= sinceDate;

  const disbursedPeriod = DB.loans.filter(l=>inPeriod(l.disbursedAt)).reduce((s,l)=>s+l.principal,0);
  const collectionsPeriod = DB.payments.filter(p=>p.status!=="Unposted" && inPeriod(p.date)).reduce((s,p)=>s+p.amount,0);
  const revenuePeriod = DB.payments.filter(p=>p.status!=="Unposted" && inPeriod(p.date)).reduce((s,p)=>s+(p.allocated.interest||0),0);
  const expensesPeriod = DB.expenses.filter(e=>inPeriod(e.date)).reduce((s,e)=>s+e.amount,0);
  const netProfitPeriod = revenuePeriod - expensesPeriod;
  const duePeriod = activeLoans().flatMap(l=>l.schedule).filter(r=>inPeriod(r.dueDate)).reduce((s,r)=>s+r.totalDue,0);
  // Real, shared backend Collection Rate engine — not recalculated here.
  // Falls back to the local period-based figure only while the real
  // fetch is still in flight on first render.
  if(!DB.acctPages.collrate) loadCollectionRate('monthly');
  const collectionRate = DB.acctPages.collrate ? DB.acctPages.collrate.rate : (duePeriod>0 ? Math.min(150, collectionsPeriod/duePeriod*100) : 100);

  // previous equivalent period, for growth comparison
  const prevSince = addDays(sinceDate, -periods[period]);
  const inPrevPeriod = d => d && d.slice(0,10) >= prevSince && d.slice(0,10) < sinceDate;
  const disbursedPrev = DB.loans.filter(l=>inPrevPeriod(l.disbursedAt)).reduce((s,l)=>s+l.principal,0);
  const loanGrowth = disbursedPrev>0 ? (disbursedPeriod-disbursedPrev)/disbursedPrev*100 : (disbursedPeriod>0?100:0);
  const revenuePrev = DB.payments.filter(p=>p.status!=="Unposted" && inPrevPeriod(p.date)).reduce((s,p)=>s+(p.allocated.interest||0),0);
  const revenueGrowth = revenuePrev>0 ? (revenuePeriod-revenuePrev)/revenuePrev*100 : (revenuePeriod>0?100:0);

  const cashPosition = (DB.cashPosition ? (DB.cashPosition.cash||0)+(DB.cashPosition.bank||0)+(DB.cashPosition.mpesa||0) : 0); // real, from the authoritative backend endpoint — see loadCoreData()
  const profitMargin = revenuePeriod>0 ? netProfitPeriod/revenuePeriod*100 : 0;

  const branchLeaderboard = DB.branches.map(b=>{
    const bl = activeLoans().filter(l=>l.branchId===b.id);
    const bal = bl.reduce((s,l)=>s+loanBalance(l),0);
    const disb = DB.loans.filter(l=>l.branchId===b.id && inPeriod(l.disbursedAt)).reduce((s,l)=>s+l.principal,0);
    const coll = DB.payments.filter(p=>p.status!=="Unposted" && inPeriod(p.date) && (DB.loans.find(l=>l.id===p.loanId)||{}).branchId===b.id).reduce((s,p)=>s+p.amount,0);
    const due = bl.flatMap(l=>l.schedule).filter(r=>inPeriod(r.dueDate)).reduce((s,r)=>s+r.totalDue,0);
    const collRate = due>0 ? Math.min(150, coll/due*100) : 100;
    const par = bal>0 ? bl.filter(l=>loanArrearsDays(l)>0).reduce((s,l)=>s+loanBalance(l),0)/bal*100 : 0;
    const target = DB.staff.filter(s=>s.branch===b.id && s.role==="Loan Officer").reduce((s,o)=>s+o.target,0) || 1;
    const targetAchievement = disb/target*100;
    const score = Math.max(0, collRate*0.4 + (100-par*2)*0.3 + Math.min(150,targetAchievement)*0.3);
    return {name:b.name, clients:new Set(bl.map(l=>l.clientId)).size, portfolio:bal, disbursement:disb, collRate, par, targetAchievement, score};
  }).sort((a,b)=>b.score-a.score);
  const tierFor = s => s>=85?"Top Performer":s>=60?"Average":"Needs Attention";
  const tierColor = t => t==="Top Performer"?"green":t==="Average"?"amber":"red";

  const ranked = rankedOfficerScores();
  const topOfficers = ranked.slice(0,3);

  const parBuckets = [1,7,30,60,90].map(d=>({d, par:parAtThreshold(d)}));
  const defaultRate = DB.loans.filter(l=>l.disbursedAt).length>0 ? (DB.loans.filter(l=>l.status==="Written Off").length / DB.loans.filter(l=>l.disbursedAt).length*100) : 0;
  const writeOffsAmt = DB.loans.filter(l=>l.status==="Written Off").reduce((s,l)=>s+l.principal,0);

  const expected7 = activeLoans().flatMap(l=>l.schedule).filter(r=>r.status!=="Paid" && r.dueDate && daysBetween(todayISO(),r.dueDate)>=0 && daysBetween(todayISO(),r.dueDate)<=7).reduce((s,r)=>s+Math.max(0,r.totalDue-(r.paidAmount||0)),0);
  const expected30d = activeLoans().flatMap(l=>l.schedule).filter(r=>r.status!=="Paid" && r.dueDate && daysBetween(todayISO(),r.dueDate)>=0 && daysBetween(todayISO(),r.dueDate)<=30).reduce((s,r)=>s+Math.max(0,r.totalDue-(r.paidAmount||0)),0);
  const undisbursedApproved = DB.loans.filter(l=>l.status==="Approved for Disbursement").reduce((s,l)=>s+l.principal,0);

  // strategic alerts — thresholds computed from real data, not scripted
  const alerts = [];
  const branchBelowTarget = branchLeaderboard.find(b=>b.targetAchievement<80);
  if(branchBelowTarget) alerts.push({sev:"orange", msg:`${branchBelowTarget.name} is below its ${period} disbursement target (${branchBelowTarget.targetAchievement.toFixed(0)}% achieved).`});
  if(loanGrowth<0) alerts.push({sev:"red", msg:`Disbursement fell ${Math.abs(loanGrowth).toFixed(1)}% vs. the previous ${period}.`});
  if(loanGrowth>=15) alerts.push({sev:"green", msg:`Disbursement grew ${loanGrowth.toFixed(1)}% vs. the previous ${period}.`});
  if(revenueGrowth>=15) alerts.push({sev:"green", msg:`Revenue grew ${revenueGrowth.toFixed(1)}% vs. the previous ${period}.`});
  if(st.par>10) alerts.push({sev:"red", msg:`Portfolio at Risk is ${st.par.toFixed(1)}%, above the 10% threshold.`});

  // business intelligence — computed comparisons, not invented text
  const worstCollBranch = [...branchLeaderboard].sort((a,b)=>a.collRate-b.collRate)[0];
  const bestRevenueGrowthNote = revenueGrowth>=0 ? `Revenue is ${revenueGrowth.toFixed(1)}% ${revenueGrowth>=0?'up':'down'} vs. the prior ${period}.` : `Revenue is down ${Math.abs(revenueGrowth).toFixed(1)}% vs. the prior ${period}.`;
  const liquidityNote = Math.abs(cashPosition) < expected30d - expected7 ? "Cash on hand may not cover the next 30 days of expected disbursements — worth a liquidity review." : "Liquidity looks sufficient to cover the next 30 days of expected activity.";

  // Pending management actions — CEO holds manage_users (company-wide staff
  // authority), so leave/salary-advance requests genuinely land on their
  // desk when no closer manager exists to decide, or simply as visibility
  // into what's outstanding. Real data, real decide action, not a static list.

  const pendingAdvances = (DB.salaryAdvances||[]).filter(a=>a.status==="Pending");

  return `
    <div class="card">
      <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start;">
        <div style="width:96px; height:96px; border-radius:10px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; flex-shrink:0;">${me.name.split(" ").map(w=>w[0]).join("").slice(0,2)}</div>
        <div style="flex:1; min-width:220px;">
          <div style="font-size:19px; font-weight:800; color:var(--navy);">${escapeHtml(me.name)}</div>
          <div style="display:flex; flex-direction:column; gap:6px; margin-top:8px; font-size:13px; color:var(--ink-soft);">
            <div>💼 CEO</div>
            <div>🌍 Organization-wide Executive Scope</div>
            <div>🏖️ ${me.leaveDays} Leave Days</div>
            <div>👁️ Executive Management Access</div>
          </div>
          <div style="margin-top:10px;"><a onclick="openModal('apply-leave')" style="color:var(--navy); font-weight:700; font-size:12.5px; cursor:pointer;">Apply Leave</a> &nbsp;|&nbsp;
          <a onclick="openModal('request-advance')" style="color:var(--navy); font-weight:700; font-size:12.5px; cursor:pointer;">Request Advance</a></div>
        </div>
      </div>
      <div class="pill-row" style="margin-top:16px;">
        <button class="btn btn-outline btn-sm" onclick="goTo('reports')">Executive Reports</button>
        <button class="btn btn-outline btn-sm" onclick="goTo('staff')">Staff Management</button>
        <button class="btn btn-outline btn-sm" onclick="goTo('accounting')">Financial Overview</button>
      </div>
    </div>

    ${(pendingLeave.length + pendingAdvances.length) > 0 ? `
    <div class="card">
      <div class="card-title">Pending Staff Requests <small>${pendingLeave.length + pendingAdvances.length} awaiting a decision</small></div>
      <div class="table-wrap"><table><tr><th>Type</th><th>Staff</th><th>Details</th><th></th></tr>
        ${pendingLeave.map(l=>`<tr><td>Leave (${l.leave_type})</td><td>${staffName(l.user_id)}</td><td>${l.start_date} → ${l.end_date}</td>
          <td><button class="btn btn-sm btn-green" onclick="withRequest('decide-leave', ()=>decideLeaveRequest('${l.id}','Approved'))">Approve</button>
          <button class="btn btn-sm btn-red" onclick="withRequest('decide-leave', ()=>decideLeaveRequest('${l.id}','Rejected'))">Reject</button></td></tr>`).join("")}
        ${pendingAdvances.map(a=>`<tr><td>Salary Advance</td><td>${staffName(a.user_id)}</td><td>${fmt(a.amount)}${a.reason?' — '+escapeHtml(a.reason):''}</td>

          <button class="btn btn-sm btn-red" onclick="withRequest('decide-advance', ()=>decideSalaryAdvance('${a.id}','Rejected'))">Reject</button></td></tr>`).join("")}
      </table></div>
    </div>` : ""}

    <div class="section-note">Executive command center — how is Rhinocash performing right now, and where are the problems?</div>
    <div class="pill-row">
      ${Object.keys(periods).map(p=>`<button class="btn btn-sm ${period===p?'btn-primary':'btn-outline'}" onclick="session.ceoPeriod='${p}'; renderApp();">${p[0].toUpperCase()+p.slice(1)}</button>`).join("")}

/* ==================== DIRECTOR DASHBOARD — governance, ownership, capital, risk ==================== */
function renderDirectorDashboard(){
  const meRaw = DB.me;
  if(!meRaw) return `<div class="empty">No director profile found.</div>`;
  const me = { name: meRaw.name, leaveDays: meRaw.leave_days_balance ?? 0 };
  const st = computeStats(null);
  const totalShareCapital = DB.shareholders.reduce((s,sh)=>s+sh.shareCapital,0);
  const totalInvestorCapital = DB.investors.reduce((s,i)=>s+i.amount,0);
  const totalCapitalEmployed = totalShareCapital + totalInvestorCapital;
  const allTimeInterest = DB.payments.filter(p=>p.status!=="Unposted").reduce((s,p)=>s+(p.allocated.interest||0),0);
  const allTimeExpenses = DB.expenses.reduce((s,e)=>s+e.amount,0);
  const retainedEarnings = allTimeInterest - allTimeExpenses;
  const netWorth = totalShareCapital + retainedEarnings;
  const cashPosition = (DB.cashPosition ? (DB.cashPosition.cash||0)+(DB.cashPosition.bank||0)+(DB.cashPosition.mpesa||0) : 0); // real, from the authoritative backend endpoint — see loadCoreData()
  const totalAssets = Math.abs(cashPosition) + st.portfolioOutstanding;
  const totalLiabilities = 0; // not modeled in this prototype — see note below
  const profitMargin = allTimeInterest>0 ? retainedEarnings/allTimeInterest*100 : 0;
  const roc = totalCapitalEmployed>0 ? retainedEarnings/totalCapitalEmployed*100 : 0;
  const roa = totalAssets>0 ? retainedEarnings/totalAssets*100 : 0;
  const costToIncome = allTimeInterest>0 ? allTimeExpenses/allTimeInterest*100 : 0;
  const capitalUtilization = totalCapitalEmployed>0 ? st.portfolioOutstanding/totalCapitalEmployed*100 : 0;

  const series = monthlySeries(6);

  const profitGrowth = series.length>=2 && series[series.length-2].netProfit!==0 ? (series[series.length-1].netProfit-series[series.length-2].netProfit)/Math.abs(series[series.length-2].netProfit)*100 : 0;

/* ==================== INVESTOR DASHBOARD — strictly own investment only ==================== */
function renderInvestorDashboard(){
  // CRITICAL FIX: this used to be `DB.investors.find(...) || DB.investors[0]`

  // fetched for a real Investor session, so this always fell through to

  // undefined (empty array) — meaning the dashboard's own logic already
  // caught it as "No investment record found" 100% of the time, for every
  // real Investor login. The real authenticated investor record comes
  // from GET /api/investor/me, already loaded into DB.me exactly like
  // every other role's own profile.
  const meRaw = DB.me;
  if(!meRaw) return `<div class="empty">No investment record found. If you believe this is an error, contact support — this should only happen if your investment record has been removed.</div>`;
  // GET /api/investor/me returns the investor object directly, already in
  // camelCase (unlike the staff /api/auth/me contract) — no translation needed.
  const inv = {
    id: meRaw.id, name: meRaw.name, amount: meRaw.amount, profitSharePct: meRaw.profitSharePct,
    termMonths: meRaw.termMonths, startDate: meRaw.startDate, status: meRaw.status,
  };
  const maturity = addMonths(inv.startDate, inv.termMonths);

  // Real payouts, real field names (investor_id/period/investor_profit —
  // not the old investorId/month this was written against). The stored
  // company_net_profit/investor_profit on each payout row are the real,
  // server-computed figures at the time the Admin/Director marked it
  // paid — NOT re-derived here from DB.payments/DB.expenses, which aren't
  // even fetched for an Investor session (no access to raw client/loan
  // financial detail — that's the whole point of the isolation).
  const payouts = (DB.investorPayouts||[]).filter(p=>p.investorId===inv.id).sort((a,b)=>(a.period||"").localeCompare(b.period||""));

  const profitPaid = payouts.filter(r=>r.status==="Paid").reduce((s,r)=>s+(r.investorProfit||0),0);
  const profitPending = profitEarned - profitPaid;
  const capitalReturned = inv.status==="Completed" ? inv.amount : 0;
  const totalReceived = profitPaid + capitalReturned;
  const monthsElapsed = payouts.length;

  // Real, aggregate-only company performance — from the dedicated backend
  // endpoint built specifically for investor consumption (no client/staff
  // names, no per-loan detail). Previously this section used
  // computeStats(null) + raw DB.loans/DB.payments, none of which are ever
  // populated for an Investor session, so every figure here was silently 0.
  const perf = DB.investorCompanyPerformance || {};

  return `

            <div>💼 Investor</div>
            <div>📈 ${inv.status} — Profit-Sharing Investment</div>
            <div>👁️ Own Investment Access Only</div>
          </div>
        </div>
      </div>
      <div class="section-note" style="margin-top:14px;">This is a restricted view — you only see your own investment. No client names, staff information, other investors, or internal accounting records are shown here.</div>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Original Investment</div><div class="kpi-value">${fmt(inv.amount)}</div></div>
      <div class="kpi"><div class="kpi-label">Status</div><div class="kpi-value" style="font-size:18px;">${inv.status}</div></div>
      <div class="kpi"><div class="kpi-label">Profit Earned</div><div class="kpi-value">${fmt(profitEarned)}</div></div>
      <div class="kpi"><div class="kpi-label">Profit Paid</div><div class="kpi-value">${fmt(profitPaid)}</div></div>
      <div class="kpi"><div class="kpi-label">Pending Profit</div><div class="kpi-value">${fmt(profitPending)}</div></div>
      <div class="kpi"><div class="kpi-label">Capital Due</div><div class="kpi-value">${fmt(inv.amount-capitalReturned)}</div></div>
      <div class="kpi"><div class="kpi-label">Start Date</div><div class="kpi-value" style="font-size:16px;">${inv.startDate}</div></div>
      <div class="kpi"><div class="kpi-label">Maturity Date</div><div class="kpi-value" style="font-size:16px;">${maturity}</div></div>
    </div>

    <div class="card">
      <div class="card-title">Investment Summary</div>
      <div class="two-col">
        <div>

async function loadClientDirectory(filters, page){
  // Keyed by state, not a bare string — a fixed key would let withRequest's
  // duplicate-call guard silently drop a fresh request for a NEW filter
  // (e.g. switching the category dropdown before the previous load
  // finished) just because an older, now-superseded request was still
  // in flight, leaving the page — and its heading — stuck on stale data.
  return withRequest('load-clientdir:'+JSON.stringify(filters||{})+':'+(page||1), async ()=>{
    const params = new URLSearchParams(); Object.entries(filters||{}).forEach(([k,v])=>{ if(v) params.set(k,v); }); params.set('page',page||1); params.set('limit',25);
    const res = await api.get('/api/clients?'+params.toString());
    DB.acctPages.clientdir = { clients: res.clients.map(adaptClient), pagination: res.pagination, filters: filters||{}, page: res.pagination.page };
  });
}
// The visible dropdown label ('All'/'Dormant'/'Active'/'Blacklisted'/
// 'Unfunded') is stashed on filters.category purely so the page can
// re-render the right heading/selection — it isn't a real query param,
// and the backend harmlessly ignores it.
const CLIENT_DIR_CATEGORIES = ['All','Dormant','Active','Blacklisted','Unfunded'];
function setClientDirCategory(category){
  const prev = DB.acctPages.clientdir ? DB.acctPages.clientdir.filters : {};
  const merged = { q: prev.q, branch_id: prev.branch_id, category };
  if(category==='Unfunded'){ merged.unfunded = 'true'; }
  else if(category!=='All'){ merged.status = category; }
  loadClientDirectory(merged, 1);
}
function submitClientDirFilter(ev){
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  Object.keys(f).forEach(k=>{ if(!f[k]) delete f[k]; });
  const prev = DB.acctPages.clientdir ? DB.acctPages.clientdir.filters : {};
  const merged = { ...prev, ...f };
  if(merged.status==='All'){ delete merged.status; }
  if(merged.status==='Unfunded'){ delete merged.status; merged.unfunded='true'; }
  return loadClientDirectory(merged, 1);
}

async function generateClientReport(format){

// Utility Payments — no binary .xlsx parser in this dependency-free
// build). "Loan officer" is a real staff_code, matched server-side
// against Loan Officer users — never a free-text name.
const IMPORT_CLIENTS_COLUMNS = ["name","phone","national_id","loan_officer","location","kin_contact","next_of_kin","business_type"];
function openImportClientsModal(){
  DB.importClientsForm = { fileName:"", rows:null, parseError:null };
  openModal('import-clients');
}
function parseImportClientsCsv(text){
  const lines = text.split(/\r\n|\n|\r/).filter(l=>l.trim().length);
  if(lines.length < 2) return { rows:[], error:"The file has no data rows below the header." };
  const splitLine = l => l.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
  const dataLines = lines.slice(1); // first line is the header row
  const rows = dataLines.map(l=>{
    const cells = splitLine(l);
    const row = {};
    IMPORT_CLIENTS_COLUMNS.forEach((key,i)=>{ row[key] = (cells[i]||'').trim(); });
    return row;
  }).filter(r=>r.name || r.phone);
  return { rows, error:null };
}
function handleImportClientsFileChange(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const f = DB.importClientsForm;
  f.fileName = file.name;
  f.rows = null; f.parseError = null;
  if(!/\.csv$/i.test(file.name)){
    f.parseError = "This build can only parse .csv files — export your filled Excel template as CSV (File → Save As → CSV) and select that file instead.";
    renderApp(); return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const { rows, error } = parseImportClientsCsv(String(reader.result||''));
    f.rows = rows; f.parseError = error;
    renderApp();
  };
  reader.onerror = () => { f.parseError = "Could not read that file."; renderApp(); };
  reader.readAsText(file);
  renderApp();
}
function submitImportClients(){
  const f = DB.importClientsForm;
  if(!f.rows || !f.rows.length){ toast("Choose a filled CSV file first"); return; }
  return withRequest('import-clients', async ()=>{
    const res = await api.post('/api/clients/bulk', { rows:f.rows });
    toast(res.errors && res.errors.length
      ? `Imported ${res.created} of ${f.rows.length} row(s) — ${res.errors.length} failed (see console for details)`
      : `Imported all ${res.created} row(s) successfully`);
    if(res.errors && res.errors.length) console.error('Client import row errors:', res.errors);
    if(res.created > 0){ closeModal(); DB.acctPages.clientdir = null; renderApp(); }
  });
}

// A dedicated DOM node outside the normal render tree — updated by direct
// writes, never via renderApp() — so the save's progress animation can
// run without ever wiping the form's typed values or chosen files (a
// file input's chosen file is lost the instant its element is replaced;
// there is no browser workaround for that, so the render tree must
// simply never touch this form while a save is in flight).
function ensureAddClientProgressOverlay(){
  let el = document.getElementById('add-client-progress-overlay');
  if(!el){
    el = document.createElement('div');
    el.id = 'add-client-progress-overlay';
    document.body.appendChild(el);
  }
  return el;
}
async function submitAddClient(ev){
  ev.preventDefault();
  const form = ev.target;
  const f = Object.fromEntries(new FormData(form));
  const fileFields = [
    { input: 'clientPhoto', docType: 'Client Photo' },
    { input: 'idPhotoFront', docType: 'ID Photo Front' },
    { input: 'idPhotoBack', docType: 'ID Photo Back' },
  ];
  const overlay = ensureAddClientProgressOverlay();
  const paintProgress = (pct) => { overlay.innerHTML = `
    <div style="position:fixed; inset:0; background:rgba(255,255,255,0.94); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div style="font-size:15px; color:var(--navy); font-weight:700; margin-bottom:14px;">Saving Client…</div>
      <div style="font-size:36px; font-weight:800; color:var(--green); margin-bottom:14px;">${pct}%</div>
      <div style="width:200px; background:#EFEDE7; border-radius:20px; height:8px; overflow:hidden;">
        <div style="background:var(--green); height:100%; width:${pct}%;"></div>
      </div>
    </div>`; };
  // Creeps toward, but never reaches, 100% on its own — only the real
  // save below (success or failure) decides when this actually ends.
  let pct = 1;
  paintProgress(pct);
  const timer = setInterval(() => { if(pct < 90){ pct = Math.min(90, pct + 1 + Math.floor(Math.random()*6)); paintProgress(pct); } }, 100);
  await withRequest('add-client', async ()=>{
    const c = await addClient(f);
    // Real uploads, attached as real client_documents rows — only for
    // fields the user actually chose a file for.
    for(const ff of fileFields){
      const fileInput = form.elements[ff.input];
      const file = fileInput && fileInput.files && fileInput.files[0];
      if(!file) continue;
      const uploaded = await uploadFile(file);
      await api.post(`/api/clients/${c.id}/documents`, { name:file.name, doc_type:ff.docType, file_path:uploaded.path });
    }
    clearInterval(timer);
    paintProgress(100);
    // Every delay here is awaited in-line, never a detached setTimeout —
    // this function's promise only resolves once the popup has actually
    // shown and closed, so nothing can fire later against whatever the
    // app has moved on to by then.
    await new Promise(r=>setTimeout(r, 350));
    overlay.innerHTML = "";
    openModal('client-added-success');
    await new Promise(r=>setTimeout(r, 1600));
    if(modal && modal.type==='client-added-success'){ closeModal(); goTo("clients","All Clients"); }
  });
  clearInterval(timer);
  overlay.innerHTML = ""; // no-op if the success path above already cleared it
  return false;
}

function openClient(id){
  if(session.selectedClientId !== id){ session.clientHistoryTab = null; session.clientNotesOpen = false; session.clientAccountOpen = false; DB.clientAccounts = null; DB.clientAccountTransactions = null; }
  session.selectedClientId = id;

  return withRequest('open-client-'+id, async ()=>{
    const res = await api.get(`/api/clients/${id}`);
    const idx = DB.clients.findIndex(c=>c.id===id);
    const adapted = adaptClient(res.client);
    if(idx>=0) DB.clients[idx] = adapted; else DB.clients.unshift(adapted);
    DB.interactions = DB.interactions.filter(i=>i.clientId!==id).concat(
      res.interactions.map(i=>({ id:i.id, clientId:id, type:i.type, note:i.note, staff:session.userName, date:i.created_at }))
    );
    DB.documents = DB.documents.filter(d=>d.clientId!==id).concat(
      res.documents.map(d=>({ id:d.id, clientId:id, name:d.name, type:d.doc_type, filePath:d.file_path, date:d.created_at }))
    );
    // The loans embedded in this response are the client's real loans —
    // merge them into the cache too so "Loans" on this page is accurate
    // even for loans this session hasn't separately listed yet.
    res.loans.forEach(l=>{
      const adaptedLoan = adaptLoan(l);
      const li = DB.loans.findIndex(x=>x.id===l.id);

  });
}

// ---- Installments / per-installment transactions / receipt: all derived
// from real loan_schedule + payment_allocations + payments rows (the
// GET /api/loans/:id/schedule/:scheduleId/transactions endpoint). The
// schema never stores a principal/interest split per payment, so the
// server reconstructs it by replaying each real amount_applied value,
// principal first — never fabricated, just derived from real numbers. ----
// On-time rule: a fully-settled installment is red only if its latest real
// payment landed after its due date (paid late); an unsettled one is red
// only once its due date has already passed (overdue). Anything else is
// black — paid on time, or simply not yet due.
function installmentIsLate(row){
  if(row.totalDue>0 && (row.paidAmount||0) >= row.totalDue){
    return !!(row.lastPaymentDate && row.lastPaymentDate.slice(0,10) > row.dueDate);
  }
  return row.dueDate < todayISO();
}

// A real, non-fabricated preview for a loan that hasn't been disbursed

// the officer can still see what they're about to disburse, computed
// with the exact same real math buildSchedule() itself uses server-side
// (a real term_weeks product: one lump-sum installment at principal *
// rate/100 interest; a legacy monthly product: the usual flat-rate
// split over loan.term periods) — clearly labeled "Projected", never
// presented as if it were the real, disbursed schedule.
function renderProjectedInstallmentsPreview(loan){
  const product = DB.products.find(p=>p.id===loan.productId);

  } else if(product){
    const totalInterest = loan.principal * (product.rate/100) * loan.term;
    const principalPerPeriod = loan.principal/loan.term;
    const interestPerPeriod = totalInterest/loan.term;
    for(let i=1;i<=loan.term;i++) rows.push({ label:`Period ${i}`, principal:principalPerPeriod, interest:interestPerPeriod, total:principalPerPeriod+interestPerPeriod });
  }

        ${rows.length ? `<tr style="font-weight:700; background:#F5F4F1;"><td>Total</td><td>${fmtNum(totalP)}</td><td>${fmtNum(totalI)}</td><td>${fmtNum(totalT)}</td></tr>` : ""}

function renderInstallmentsModal(){

function renderLoanLedgerStatementModal(){

  if(!fresh) return `<div class="empty">Loading…</div>`;
  const client = DB.clients.find(c=>c.id===loan.clientId);
  const totalInterest = (loan.schedule||[]).reduce((s,r)=>s+r.interestDue,0);
  // `delta` drives the running balance directly (positive = adds to what
  // the client owes, negative = a real repayment reducing it) — kept
  // separate from the Debit/Credit display columns below, which mirror
  // the reference statement's own layout (disbursement/interest/penalty
  // charges display under Credit even though they increase the balance;
  // real repayments display under Credit too, but reduce it).
  const rows = [];
  if(loan.disbursedAt){
    // The real processing fee is deducted straight out of the disbursed
    // cash (see completeDisbursement()'s own note) — it never touches
    // what the client owes, so it's disclosed here for transparency but
    // does not move the running balance.
    const feeNote = loan.processingFee>0.004 ? ` (net of a real ${fmtNum(loan.processingFee)} processing fee)` : '';
    rows.push({ date:loan.disbursedAt, desc:`Disbursement to ${escapeHtml(client?client.name:'client')} via ${escapeHtml(statementChannelLabel(loan.disbursementChannel))}${feeNote}. Ref ${loan.id.slice(-8).toUpperCase()}`, debit:0, credit:loan.principal, delta:loan.principal });
    rows.push({ date:loan.disbursedAt, desc:'Interest charges applied', debit:totalInterest, credit:0, delta:totalInterest });
  }
  // Real penalty charge lines — one per real overdue installment that has
  // genuinely accrued a penalty (loan_schedule.penalty_due, only ever set
  // by accrueOverduePenalties() once that installment's real due date has
  // passed unpaid), dated to that installment's own due date.
  (loan.schedule||[]).filter(r=>(r.penaltyDue||0)>0.004).forEach(r=>{
    rows.push({ date:r.dueDate, desc:`Late payment penalty charged — Installment #${r.period}`, debit:r.penaltyDue, credit:0, delta:r.penaltyDue });
  });
  paysData.payments.forEach(p=>{
    if((p.allocated.principal||0)>0.004){
      rows.push({ date:p.date, desc:`Principal paid via ${escapeHtml(statementChannelLabel(p.channel))}. Ref ${escapeHtml(p.reference||'—')}`, debit:0, credit:p.allocated.principal, delta:-p.allocated.principal });
    }
    if((p.allocated.interest||0)>0.004){
      rows.push({ date:p.date, desc:`Interest paid via ${escapeHtml(statementChannelLabel(p.channel))}. Ref ${escapeHtml(p.reference||'—')}`, debit:0, credit:p.allocated.interest, delta:-p.allocated.interest });
    }
    if((p.allocated.penalty||0)>0.004){
      rows.push({ date:p.date, desc:`Penalty paid via ${escapeHtml(statementChannelLabel(p.channel))}. Ref ${escapeHtml(p.reference||'—')}`, debit:0, credit:p.allocated.penalty, delta:-p.allocated.penalty });
    }
  });
  rows.sort((a,b)=> new Date(a.date)-new Date(b.date));
  let balance = 0;
  rows.forEach(r=>{ balance += r.delta; r.balance = balance; });
  const rowsHtml = rows.map(r=>`<tr>
    <td>${fmtLoanDetailDateTime(r.date)}</td>
    <td>${r.desc}</td>
    <td>${r.debit>0.004?fmtNum(r.debit):''}</td>

// Real "Repeat Loan" convenience prefill — the actual enforcement (a
// Repeat Loan requires a genuine prior loan, and inherits its real
// guarantor when the form doesn't supply one) lives server-side in
// POST /api/loans; this just saves the officer retyping what the
// backend would fill in anyway, using the client's own already-loaded
// real loan history (DB.loans) rather than a fresh round trip.
function handleLoanCategoryChange(value, formEl){
  if(value !== 'Repeat Loan') return;
  const st = session.loanAppState;
  if(!st || !st.matchedClient) return;
  const priorLoans = DB.loans.filter(l=>l.clientId===st.matchedClient.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const prior = priorLoans[0];
  if(!prior) return;
  const form = formEl.form;
  if(prior.guarantor && !form.elements['guarantor'].value) form.elements['guarantor'].value = prior.guarantor;
  if(prior.guarantorContact && !form.elements['guarantor_contact'].value) form.elements['guarantor_contact'].value = prior.guarantorContact;
}

// Real client lookup — triggered as the officer types the client's real
// ID number, using the exact same real search the client directory
// already supports. State-driven (not direct DOM writes) so a real
// match genuinely re-renders the form with the real "Payment for
// Processing Fee" field, populated from the client's own real
// registered contact numbers — nothing fabricated, no placeholder name.
let loanAppLookupTimer = null;
function lookupClientForLoanApp(idNumber){
  const st = session.loanAppState;
  st.idNumber = idNumber; st.matchedClient = null; st.notFound = false; st.feePayment = null; st.feePhone = '';
  clearTimeout(loanAppLookupTimer);
  if(!idNumber || idNumber.length < 4){ return; }
  loanAppLookupTimer = setTimeout(()=>withRequest('loanapp-client-lookup', async ()=>{
    const res = await api.get('/api/clients?q='+encodeURIComponent(idNumber)+'&limit=5');
    const match = res.clients.find(c=>c.idNumber===idNumber) || res.clients[0];
    if(session.loanAppState.idNumber !== idNumber) return; // a newer keystroke has already superseded this lookup
    session.loanAppState.matchedClient = match || null;
    session.loanAppState.notFound = !match;
  }), 400);
}
// Real, required, upfront processing fee — appears automatically once a
// real client is matched AND a product that carries a real
// processingFeeAmount is selected, titled with the client's own real
// name. Three real states, driven entirely by the real backend: no
// payment requested yet (phone select + "Request Payment"), a real STK
// push has been attempted — successfully or not, the real message either
// way is shown verbatim, never softened — and a real M-Pesa receipt code
// can be typed in manually and confirmed regardless of whether the STK
// push itself succeeded (this sandbox has no real path for Safaricom's
// own callback to land on, so manual confirmation — a human reading back
// the real code the client received — is the real, working path, mirroring
// this codebase's existing C2B manual-reconciliation pattern); or the fee
// is genuinely Confirmed, which locks in the real processing_fee_id the
// form will submit. POST /api/loans refuses to create the loan without it.
function renderProcessingFeeSection(st, product){
  const fee = st.feePayment;
  const phoneOptions = [];
  if(st.matchedClient.phone) phoneOptions.push({ value: st.matchedClient.phone, label: `${st.matchedClient.name} - ${st.matchedClient.phone.slice(-3)}` });
  if(st.matchedClient.nextOfKinPhone) phoneOptions.push({ value: st.matchedClient.nextOfKinPhone, label: `${st.matchedClient.nextOfKin||'Next of Kin'} - ${st.matchedClient.nextOfKinPhone.slice(-3)}` });
  return `
    <div class="field" style="border:1px solid var(--border,#ddd); border-radius:8px; padding:12px; background:#FAFAF8;">
      <label style="font-weight:700;">${escapeHtml(st.matchedClient.name)} — Processing Fee</label>
      <div class="hint" style="margin:2px 0 8px;">${fmt(product.processingFeeAmount)} required before this application can be saved.</div>
      ${fee && fee.status==='Confirmed' ? `
        <div style="color:var(--green,#2c6e49); font-weight:700;">✓ Processing fee paid — Receipt ${escapeHtml(fee.receiptNumber||'')}</div>
        <input type="hidden" name="processing_fee_id" value="${escapeHtml(fee.id)}">
      ` : `
        <select onchange="session.loanAppState.feePhone=this.value;" ${phoneOptions.length===0?'disabled':''}>
          <option value="">-- Select phone --</option>
          ${phoneOptions.map(o=>`<option value="${escapeHtml(o.value)}" ${st.feePhone===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join("")}
        </select>
        ${!fee ? `
        <div><button type="button" class="btn btn-sm btn-outline" style="margin-top:8px;" onclick="initiateProcessingFee()">Request Payment</button></div>
        ` : `
        <div class="hint" style="margin-top:6px;">${escapeHtml(fee.message||'')}</div>
        <div class="field" style="margin-top:8px;"><label>M-Pesa Receipt Code</label>
          <input type="text" id="feeReceiptInput" placeholder="e.g. QGR7XJ2K9P" style="text-transform:uppercase;">
        </div>
        <button type="button" class="btn btn-sm btn-green" onclick="confirmProcessingFee(document.getElementById('feeReceiptInput').value)">Confirm Payment</button>
        `}
      `}
    </div>
  `;
}
function initiateProcessingFee(){
  const st = session.loanAppState;
  const product = DB.products.find(p=>p.id===st.productId);
  if(!st.matchedClient || !product || product.processingFeeAmount==null) return;
  if(!st.feePhone){ toast('Select a phone number to send the processing fee request to'); return; }
  return withRequest('initiate-processing-fee', async ()=>{
    const res = await api.post('/api/loans/processing-fee/initiate', { client_id: st.matchedClient.id, product_id: product.id, phone: st.feePhone });
    session.loanAppState.feePayment = { id: res.feeId, status: res.status, amount: res.amount, message: res.message };
    renderApp();
  });
}
function confirmProcessingFee(code){
  const st = session.loanAppState;
  if(!st.feePayment){ toast('Request the processing fee payment first'); return; }
  const trimmed = (code||'').trim();
  if(!trimmed){ toast('Enter the M-Pesa receipt code'); return; }
  return withRequest('confirm-processing-fee', async ()=>{
    const res = await api.post(`/api/loans/processing-fee/${st.feePayment.id}/confirm`, { mpesa_receipt_number: trimmed });
    session.loanAppState.feePayment = { id: res.fee.id, status: 'Confirmed', amount: res.fee.amount, receiptNumber: res.fee.mpesa_receipt_number };
    toast('Processing fee confirmed');
    renderApp();
  });
}
function submitLoanApp(ev){

const LOAN_APP_CATEGORIES = ['All templates','Disbursed loans','Undisbursed loans','Pended loans','Declined loans'];

function loanTermDaysLabel(loan){
  const prod = DB.products.find(p=>p.id===loan.productId);

// The loan's real most-recent event timestamp — see the block comment
// above for why this (not a fixed "Waiting for X" placeholder) is what

function loanLastActionAt(loan){
  if(loan.disbursedAt) return loan.disbursedAt;

function loanApplicationsFiltered(st){

// ---- Collection Sheet (Loan Officer): a real, single-day due-installment

function defaultCollSheetDayState(){
  const now = new Date();
  return { month: now.toISOString().slice(0,7), day: now.getDate(), portfolio:'', period:'' };
}
function collSheetDayMonthOptions(){
  const opts = []; const now = new Date();
  for(let i=0;i<12;i++){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); opts.push({ value: d.toISOString().slice(0,7), label: d.toLocaleString('en-KE',{month:'short', year:'numeric'}) }); }
  return opts;
}
function collSheetDayDayOptions(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const opts = [];
  for(let day=1; day<=daysInMonth; day++){
    const dt = new Date(y, m-1, day);
    opts.push({ value: day, label: `${dt.toLocaleDateString('en-US',{weekday:'short'})} ${day}` });
  }
  return opts;
}
async function loadCollectionSheetDay(){

function renderDailyDisbursementsCalendar(st, d){
  const dayMap = {};
  d.days.forEach(dayObj=>{ dayMap[dayObj.date] = dayObj.entries; });
  const firstOfMonth = new Date(st.year, st.month-1, 1);
  const daysInMonth = new Date(st.year, st.month, 0).getDate();
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday-first weekday index
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let day=1; day<=daysInMonth; day++) cells.push(day);
  while(cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  const dayNames = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const mm = String(st.month).padStart(2,'0');
  const rowsHtml = weeks.map(week=>`<tr>${week.map(day=>{
    if(!day) return `<td></td>`;
    const dd = String(day).padStart(2,'0');
    const dateStr = `${st.year}-${mm}-${dd}`;
    const entries = dayMap[dateStr] || [];
    return `<td style="vertical-align:top; padding:6px 8px;">
      ${entries.length ? `<div style="font-weight:700; color:var(--navy); font-size:12px;">${dd}-${mm}-${st.year}</div>` : ''}
      ${entries.map(e=>`<div style="font-size:12px; display:flex; justify-content:space-between; gap:6px;"><span>${escapeHtml(e.branchName)}</span><span>${fmtNum(e.amount)}</span></div>`).join("")}
    </td>`;
  }).join("")}</tr>`).join("");
  return `<table style="width:100%; border-collapse:collapse;">
    <tr>${dayNames.map(n=>`<th style="text-align:left; padding:6px 8px; background:#EEF0F5; font-size:12px;">${n}</th>`).join("")}</tr>
    ${rowsHtml}
  </table>`;
}

// ==================== Operational Loan Portfolio — genuinely distinct focus: flow vs stock, composition, workload, concentration ====================
let opPortfolioReqSeq = 0;
async function loadOperationalPortfolio(){
  const st = session.opPortfolioState;
  // Keyed by the filter state, not a flat string, and stamped with a request
  // sequence number: this page's render function re-triggers a load whenever
  // DB.operationalPortfolio's cached stateKey doesn't match the current
  // filters (e.g. navigating in with new filters while a stale,
  // differently-filtered fetch is still in flight). A flat key would let
  // withRequest's duplicate-guard silently drop the second, correct fetch;
  // and even with distinct keys, two real concurrent requests can resolve
  // out of order over the network, so the sequence check discards a
  // response that a newer request has since superseded instead of letting
  // whichever one happens to arrive last win.
  const seq = ++opPortfolioReqSeq;
  return withRequest('load-operational-portfolio:'+JSON.stringify(st), async ()=>{
    const params = new URLSearchParams();
    if(st.from) params.set('from', st.from);
    if(st.to) params.set('to', st.to);
    if(st.branchId) params.set('branch_id', st.branchId);
    if(st.officerId) params.set('officer_id', st.officerId);
    if(st.productId) params.set('product_id', st.productId);
    if(st.q) params.set('q', st.q);
    params.set('page', st.page||1);
    params.set('page_size', 20);
    const result = await api.get('/api/loans/operational-portfolio?'+params.toString());

  if(!DB.approvedLoans || DB.approvedLoans.stateKey !== JSON.stringify(st)){ loadApprovedLoans(); return `<div class="card"><div class="empty">Loading…</div></div>`; }
  const d = DB.approvedLoans;
  const k = d.kpis;
  const { page, totalPages, totalRows } = d.pagination;
  const isRegional = session.role === 'Regional Manager';
  const isOperational = session.role === 'Operational Manager';
  const showBranchBreakdown = isRegional || isOperational;
  const myStaff = DB.staff.find(s=>s.id===session.userId);
  const myRegion = myStaff && myStaff.regionId ? DB.regions.find(r=>r.id===myStaff.regionId) : null;

  return `<div class="card">
    <div class="card-title">Approved Loans <small>${isRegional?`Region-wide — ${myRegion?escapeHtml(myRegion.name):''} — `:isOperational?'Company-wide — across all branches — ':''}applications that have completed the full approval chain, and how long approval actually took</small></div>
    ${isRegional ? `<div class="section-note">Region: <strong>${myRegion?escapeHtml(myRegion.name):''}</strong></div>` : ""}

    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Total Approved</div><div class="kpi-value">${k.totalApproved}</div></div>
      <div class="kpi"><div class="kpi-label">Approved Amount</div><div class="kpi-value">${fmt(k.totalApprovedAmount)}</div></div>
      <div class="kpi"><div class="kpi-label">Average Amount</div><div class="kpi-value">${fmt(k.avgApprovedAmount)}</div></div>
      <div class="kpi"><div class="kpi-label">Avg Turnaround</div><div class="kpi-value">${k.avgTurnaroundDays.toFixed(1)} days</div></div>
      <div class="kpi"><div class="kpi-label">Awaiting Disbursement</div><div class="kpi-value">${k.awaitingDisbursement}</div></div>
      <div class="kpi"><div class="kpi-label">Disbursed</div><div class="kpi-value">${k.disbursed}</div></div>
    </div>
    <div class="section-note">Turnaround = time from real application submission to the real final approval step (fastest: ${k.fastestTurnaroundDays!==null?k.fastestTurnaroundDays+'d':'—'}, slowest: ${k.slowestTurnaroundDays!==null?k.slowestTurnaroundDays+'d':'—'}). Scope: only applications that have cleared every approval stage — distinct from Pending Loan Approvals (still in the workflow) and Loan Applications (full lifecycle).</div>

    <div class="card-title" style="font-size:14px; margin-top:16px;">Approval Turnaround Distribution</div>
    ${registerChart('chart-appd-turnaround', {
      type:'bar', data:{ labels: d.turnaroundDistribution.map(t=>t.bucket), datasets:[{ label:'Applications', data: d.turnaroundDistribution.map(t=>t.count), backgroundColor:'#264653' }] },
      options:{ responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true}} }
    })}

    ${showBranchBreakdown && d.byBranch.length ? `
    <div class="card-title" style="font-size:14px; margin-top:16px;">Branch Approval Turnaround</div>
    ${registerChart('chart-appd-branch', {
      type:'bar', data:{ labels: d.byBranch.map(b=>branchName(b.branchId)), datasets:[{ label:'Avg Turnaround (days)', data: d.byBranch.map(b=>b.avgTurnaroundDays), backgroundColor:'#e07a5f' }] },
      options:{ responsive:true, maintainAspectRatio:false }
    })}
    <div class="table-wrap"><table><tr><th>Branch</th><th>Approved</th><th>Amount</th><th>Avg Turnaround</th><th>Awaiting Disbursement</th></tr>
    ${d.byBranch.slice().sort((a,b)=>b.approvedCount-a.approvedCount).map(b=>`<tr class="clickable" onclick="session.mgrApprovedState.branchId='${b.branchId}'; session.mgrApprovedState.page=1; DB.approvedLoans=null; renderApp();"><td>${branchName(b.branchId)}</td><td>${b.approvedCount}</td><td>${fmt(b.approvedAmount).replace('KES ','')}</td><td>${b.avgTurnaroundDays.toFixed(1)}d</td><td>${b.awaitingDisbursement}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">No data.</td></tr>`}</table></div>
    ${st.branchId ? `<button class="btn btn-sm btn-outline" style="margin-top:8px;" onclick="session.mgrApprovedState.branchId=''; session.mgrApprovedState.page=1; DB.approvedLoans=null; renderApp();">← All Branches</button>` : ""}
    ` : ""}

    <div class="two-col" style="margin-top:16px;">
      <div>
        <div class="card-title" style="font-size:14px;">Officer Approval Outcomes</div>
        <div class="table-wrap"><table><tr><th>Officer</th>${showBranchBreakdown?'<th>Branch</th>':''}<th>Approved</th><th>Amount</th><th>Avg Turnaround</th></tr>
        ${d.byOfficer.slice().sort((a,b)=>b.approvedCount-a.approvedCount).map(o=>`<tr class="clickable" onclick="session.mgrApprovedState.officerId='${o.officerId}'; session.mgrApprovedState.page=1; DB.approvedLoans=null; renderApp();"><td>${staffName(o.officerId)}</td>${showBranchBreakdown?`<td>${branchName((DB.staff.find(s2=>s2.id===o.officerId)||{}).branch)}</td>`:''}<td>${o.approvedCount}</td><td>${fmt(o.approvedAmount).replace('KES ','')}</td><td>${o.avgTurnaroundDays.toFixed(1)}d</td></tr>`).join("") || `<tr><td colspan="5" class="empty">No data.</td></tr>`}</table></div>
      </div>
      <div>
        <div class="card-title" style="font-size:14px;">Product Approval Analysis</div>
        <div class="table-wrap"><table><tr><th>Product</th><th>Approved</th><th>Amount</th></tr>
        ${d.byProduct.map(p=>`<tr class="clickable" onclick="session.mgrApprovedState.productId='${p.productId}'; session.mgrApprovedState.page=1; DB.approvedLoans=null; renderApp();"><td>${escapeHtml(productName(p.productId))}</td><td>${p.approvedCount}</td><td>${fmt(p.approvedAmount).replace('KES ','')}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">No data.</td></tr>`}</table></div>
      </div>
    </div>

    <div class="pill-row" style="margin:16px 0 10px;">
      ${showBranchBreakdown ? `<select onchange="session.mgrApprovedState.branchId=this.value; session.mgrApprovedState.page=1; DB.approvedLoans=null; renderApp();">
        <option value="">-- Branch --</option>
        ${DB.branches.map(b=>`<option value="${b.id}" ${b.id===st.branchId?'selected':''}>${escapeHtml(b.name)}</option>`).join("")}
      </select>` : ""}
      <select onchange="session.mgrApprovedState.officerId=this.value; session.mgrApprovedState.page=1; DB.approvedLoans=null; renderApp();">
        <option value="">-- Loan Officer --</option>
        ${DB.staff.filter(s2=>s2.role==='Loan Officer').map(o=>`<option value="${o.id}" ${o.id===st.officerId?'selected':''}>${escapeHtml(o.name)}</option>`).join("")}
      </select>
      <select onchange="session.mgrApprovedState.productId=this.value; session.mgrApprovedState.page=1; DB.approvedLoans=null; renderApp();">
        <option value="">-- Loan Product --</option>
        ${DB.products.map(p=>`<option value="${p.id}" ${p.id===st.productId?'selected':''}>${escapeHtml(p.name)}</option>`).join("")}
      </select>
      <select onchange="session.mgrApprovedState.disbursedStatus=this.value; session.mgrApprovedState.page=1; DB.approvedLoans=null; renderApp();">
        <option value="">-- Disbursement Status --</option>
        <option value="yes" ${st.disbursedStatus==='yes'?'selected':''}>Disbursed</option>
        <option value="no" ${st.disbursedStatus==='no'?'selected':''}>Awaiting Disbursement</option>
      </select>
      <input placeholder="Search client" value="${escapeHtml(st.q)}" oninput="session.mgrApprovedState.q=this.value; session.mgrApprovedState.page=1; DB.approvedLoans=null; renderApp();">
      ${(st.branchId||st.officerId||st.productId||st.disbursedStatus||st.q) ? `<button class="btn btn-sm btn-outline" onclick="session.mgrApprovedState={branchId:'',officerId:'',productId:'',disbursedStatus:'',q:'',page:1}; DB.approvedLoans=null; renderApp();">Reset Filters</button>` : ""}
      <button class="btn btn-sm btn-outline" style="margin-left:auto;" onclick="exportApprovedLoans()">Export CSV</button>
    </div>

    <div class="table-wrap"><table><tr><th>Client</th><th>Officer</th>${showBranchBreakdown?'<th>Branch</th>':''}<th>Product</th><th>Amount</th><th>Submitted</th><th>Approved</th><th>Turnaround</th><th>Disbursed</th><th>Status</th></tr>
    ${d.rows.map(r=>`<tr class="clickable" onclick="openLoan('${r.loanId}')"><td>${escapeHtml(r.clientName)}</td><td>${staffName(r.officerId)}</td>${showBranchBreakdown?`<td>${branchName(r.branchId)}</td>`:''}<td>${escapeHtml(productName(r.productId))}</td><td>${fmt(r.principal).replace('KES ','')}</td><td>${new Date(r.submittedAt).toLocaleDateString()}</td><td>${r.approvedAt?new Date(r.approvedAt).toLocaleDateString():'—'}</td><td>${r.turnaroundDays!==null?r.turnaroundDays+'d':'—'}</td><td>${r.isDisbursed?'<span class="badge green">Yes</span>':'<span class="badge amber">Pending</span>'}</td><td>${statusBadge(r.status)}</td></tr>`).join("") || `<tr><td colspan="10" class="empty">No approved loans match the selected filters.</td></tr>`}</table></div>
    ${totalRows>d.pagination.pageSize ? `<div class="pill-row" style="margin-top:10px;"><button class="btn btn-sm btn-outline" ${page<=1?'disabled':''} onclick="session.mgrApprovedState.page=${page-1}; DB.approvedLoans=null; renderApp();">← Prev</button><span>Page ${page} of ${totalPages} (${totalRows} loans)</span><button class="btn btn-sm btn-outline" ${page>=totalPages?'disabled':''} onclick="session.mgrApprovedState.page=${page+1}; DB.approvedLoans=null; renderApp();">Next →</button></div>` : ""}
  </div>`;
}

function renderMaturityPipelinePage(){

  return `<div class="card">
    <div class="card-title">Loan Maturity Pipeline <small>${isRegional?`Region-wide — ${myRegion?escapeHtml(myRegion.name):''} — regional loan maturity forecast and overdue exposure`:isOperational?'Company-wide — across all branches — loan maturity forecast and overdue exposure':'Track upcoming and overdue loan maturities across your branch'}</small></div>
    ${isRegional ? `<div class="section-note">Region: <strong>${myRegion?escapeHtml(myRegion.name):''}</strong></div>` : ""}

      <div class="kpi"><div class="kpi-label">Total Outstanding</div><div class="kpi-value">${fmt(s.totalOutstanding)}</div></div>
      <div class="kpi"><div class="kpi-label">Maturing Today</div><div class="kpi-value">${s.maturingToday}</div></div>
      <div class="kpi"><div class="kpi-label">Overdue (Matured)</div><div class="kpi-value" style="color:${s.overdueCount>0?'var(--red)':'inherit'};">${s.overdueCount} (${fmt(s.overdueAmount)})</div></div>
      <div class="kpi"><div class="kpi-label">Due in 7 Days</div><div class="kpi-value">${s.dueIn7Days} <small>(${fmt(s.exposure7Days)})</small></div></div>
      <div class="kpi"><div class="kpi-label">Due in 30 Days</div><div class="kpi-value">${s.dueIn30Days} <small>(${fmt(s.exposure30Days)})</small></div></div>
      <div class="kpi"><div class="kpi-label">Due in 60 Days</div><div class="kpi-value">${s.dueIn60Days} <small>(${fmt(s.exposure60Days)})</small></div></div>
      <div class="kpi"><div class="kpi-label">Due in 90 Days</div><div class="kpi-value">${s.dueIn90Days} <small>(${fmt(s.exposure90Days)})</small></div></div>

    </div>
    <div class="section-note">Distinct financial concepts: "Outstanding" is the real current balance; the maturity date reflects the real final scheduled installment's real due date — never estimated by term × frequency when a real schedule exists.</div>

    ${d.maturedOutstanding && d.maturedOutstanding.length ? `
    <div class="card-title" style="font-size:14px; margin-top:16px;">Matured Loans with Outstanding Balance</div>
    <div class="section-note">Loans whose real contractual maturity date has passed but which still carry a real outstanding balance — not automatically defaulted; the existing risk rules still apply.</div>
    <div class="table-wrap"><table><tr><th>Client</th><th>Officer</th><th>Maturity Date</th><th>Days Since Maturity</th><th>Outstanding</th><th>Arrears</th><th>DPD</th><th>Last Payment</th></tr>
    ${d.maturedOutstanding.map(r=>`<tr class="clickable" onclick="openLoan('${r.loanId}')"><td>${escapeHtml(r.clientName)}</td><td>${staffName(r.officerId)}</td><td>${new Date(r.maturityDate).toLocaleDateString()}</td><td style="color:var(--red);">${r.daysSinceMaturity}d</td><td>${fmt(r.outstanding).replace('KES ','')}</td><td>${fmt(r.arrears).replace('KES ','')}</td><td>${r.dpd}</td><td>${r.lastPaymentDate?new Date(r.lastPaymentDate).toLocaleDateString():'—'}</td></tr>`).join("")}</table></div>
    ` : ""}

    ${d.highestExposure && d.highestExposure.length ? `
    <div class="card-title" style="font-size:14px; margin-top:16px;">Largest Upcoming Maturity Exposures</div>
    <div class="table-wrap"><table><tr><th>Client</th><th>Officer</th><th>Maturity Date</th><th>Days to Maturity</th><th>Outstanding</th></tr>
    ${d.highestExposure.map(r=>`<tr class="clickable" onclick="openLoan('${r.loanId}')"><td>${escapeHtml(r.clientName)}</td><td>${staffName(r.officerId)}</td><td>${new Date(r.maturityDate).toLocaleDateString()}</td><td style="color:${r.daysToMaturity<0?'var(--red)':'inherit'};">${r.daysToMaturity}</td><td>${fmt(r.outstanding).replace('KES ','')}</td></tr>`).join("")}</table></div>
    ` : ""}

    ${d.timeline && d.timeline.length ? `
    <div class="card-title" style="font-size:14px; margin-top:16px;">Daily Maturity Timeline (Upcoming)</div>
    ${registerChart('chart-mp-timeline', {
      type:'bar', data:{ labels: d.timeline.map(t=>new Date(t.date).toLocaleDateString()), datasets:[{ label:'Loans Maturing', data: d.timeline.map(t=>t.count), backgroundColor:'#264653' }] },
      options:{ responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true}} }
    })}
    ` : ""}

    <div class="card-title" style="font-size:14px; margin-top:16px;">Maturity Distribution</div>
    ${registerChart('chart-mp-bucket', {
      type:'bar', data:{ labels: d.byBucket.map(b=>b.bucket), datasets:[{ label:'Loans', data: d.byBucket.map(b=>b.count), backgroundColor: d.byBucket.map(b=>b.bucket==='Overdue'?'#c1121f':'#264653') }] },
      options:{ responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true}} }
    })}
    <div class="table-wrap"><table><tr><th>Bucket</th><th>Loans</th><th>Outstanding</th></tr>
    ${d.byBucket.map(b=>`<tr class="clickable" onclick="session.mgrMaturityState.bucket='${b.bucket}'; session.mgrMaturityState.page=1; DB.maturityPipeline=null; renderApp();"><td style="color:${MATURITY_BUCKET_COLORS[b.bucket]}; font-weight:700;">${b.bucket}</td><td>${b.count}</td><td>${fmt(b.amount).replace('KES ','')}</td></tr>`).join("")}</table></div>

    ${showBranchBreakdown && d.byBranch.length ? `
    <div class="card-title" style="font-size:14px; margin-top:16px;">Branch Maturity Exposure</div>
    ${registerChart('chart-mp-branch', {
      type:'bar', data:{ labels: d.byBranch.map(b=>branchName(b.branchId)), datasets:[{ label:'Overdue Amount', data: d.byBranch.map(b=>b.overdueAmount), backgroundColor:'#c1121f' }] },
      options:{ responsive:true, maintainAspectRatio:false }
    })}
    <div class="table-wrap"><table><tr><th>Branch</th><th>Total Maturing</th><th>Outstanding</th><th>Overdue</th><th>Overdue Amount</th></tr>
    ${d.byBranch.slice().sort((a,b)=>b.overdueAmount-a.overdueAmount).map(b=>`<tr class="clickable" onclick="session.mgrMaturityState.branchId='${b.branchId}'; session.mgrMaturityState.page=1; DB.maturityPipeline=null; renderApp();"><td>${branchName(b.branchId)}</td><td>${b.totalMaturing}</td><td>${fmt(b.totalOutstanding).replace('KES ','')}</td><td>${b.overdueCount}</td><td style="color:${b.overdueAmount>0?'var(--red)':'inherit'};">${fmt(b.overdueAmount).replace('KES ','')}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">No data.</td></tr>`}</table></div>
    ${st.branchId ? `<button class="btn btn-sm btn-outline" style="margin-top:8px;" onclick="session.mgrMaturityState.branchId=''; session.mgrMaturityState.page=1; DB.maturityPipeline=null; renderApp();">← All Branches</button>` : ""}

    <div class="two-col" style="margin-top:16px;">
      <div>
        <div class="card-title" style="font-size:14px;">Officer Maturity Workload</div>
        <div class="table-wrap"><table><tr><th>Officer</th><th>Maturing</th><th>Outstanding</th><th>Overdue</th></tr>
        ${d.byOfficer.slice().sort((a,b)=>b.totalOutstanding-a.totalOutstanding).map(o=>`<tr><td>${staffName(o.officerId)}</td><td>${o.totalMaturing}</td><td>${fmt(o.totalOutstanding).replace('KES ','')}</td><td style="color:${o.overdueCount>0?'var(--red)':'inherit'};">${o.overdueCount}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">No data.</td></tr>`}</table></div>
      </div>
      <div>
        <div class="card-title" style="font-size:14px;">Product Maturity Analysis</div>
        <div class="table-wrap"><table><tr><th>Product</th><th>Maturing</th><th>Outstanding</th></tr>
        ${d.byProduct.map(p=>`<tr><td>${escapeHtml(productName(p.productId))}</td><td>${p.totalMaturing}</td><td>${fmt(p.totalOutstanding).replace('KES ','')}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">No data.</td></tr>`}</table></div>
      </div>
    </div>

    ${d.maturityVsArrears && d.maturityVsArrears.length ? `

    <div class="section-note">Loans approaching or past maturity that already carry real arrears today.</div>

    ${d.maturityVsArrears.map(r=>`<tr class="clickable" onclick="openLoan('${r.loanId}')"><td>${r.loanId}</td><td>${new Date(r.maturityDate).toLocaleDateString()}</td><td>${fmt(r.outstanding).replace('KES ','')}</td><td style="color:var(--red);">${fmt(r.currentArrears).replace('KES ','')}</td></tr>`).join("")}</table></div>
    ` : ""}

    <div class="pill-row" style="margin:16px 0 10px;">

      </select>` : ""}
      <select onchange="session.mgrMaturityState.officerId=this.value; session.mgrMaturityState.page=1; DB.maturityPipeline=null; renderApp();">

      <select onchange="session.mgrMaturityState.productId=this.value; session.mgrMaturityState.page=1; DB.maturityPipeline=null; renderApp();">
        <option value="">-- Loan Product --</option>

      </select>
      <input placeholder="Search client, loan" value="${escapeHtml(st.q)}" oninput="session.mgrMaturityState.q=this.value; session.mgrMaturityState.page=1; DB.maturityPipeline=null; renderApp();">
      ${(st.branchId||st.officerId||st.productId||st.bucket||st.q) ? `<button class="btn btn-sm btn-outline" onclick="session.mgrMaturityState={branchId:'',officerId:'',productId:'',bucket:'',q:'',page:1}; DB.maturityPipeline=null; renderApp();">Reset Filters</button>` : ""}
      <button class="btn btn-sm btn-outline" style="margin-left:auto;" onclick="exportMaturityPipeline()">Export CSV</button>

    <div class="table-wrap"><table><tr><th>Client</th><th>Officer</th>${showBranchBreakdown?'<th>Branch</th>':''}<th>Product</th><th>Outstanding</th><th>Maturity Date</th><th>Days to Maturity</th><th>Bucket</th></tr>
    ${d.rows.map(r=>`<tr class="clickable" onclick="openLoan('${r.loanId}')"><td>${escapeHtml(r.clientName)}</td><td>${staffName(r.officerId)}</td>${showBranchBreakdown?`<td>${branchName(r.branchId)}</td>`:''}<td>${escapeHtml(productName(r.productId))}</td><td>${fmt(r.outstanding).replace('KES ','')}</td><td>${new Date(r.maturityDate).toLocaleDateString()}</td><td style="color:${r.daysToMaturity<0?'var(--red)':'inherit'};">${r.daysToMaturity}</td><td style="color:${MATURITY_BUCKET_COLORS[r.bucket]}; font-weight:700;">${r.bucket}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">No loans maturing match the selected filters.</td></tr>`}</table></div>
    ${totalRows>d.pagination.pageSize ? `<div class="pill-row" style="margin-top:10px;"><button class="btn btn-sm btn-outline" ${page<=1?'disabled':''} onclick="session.mgrMaturityState.page=${page-1}; DB.maturityPipeline=null; renderApp();">← Prev</button><span>Page ${page} of ${totalPages} (${totalRows} loans)</span><button class="btn btn-sm btn-outline" ${page>=totalPages?'disabled':''} onclick="session.mgrMaturityState.page=${page+1}; DB.maturityPipeline=null; renderApp();">Next →</button></div>` : ""}
  </div>`;
}

        ${DB.branches.map(b=>`<option value="${b.id}" ${b.id===st.branchId?'selected':''}>${escapeHtml(b.name)}</option>`).join("")}
      </select>` : ""}
      <select onchange="session.mgrApprovalState.officerId=this.value; session.mgrApprovalState.page=1; DB.approvalMonitoring=null; renderApp();">

    <div class="table-wrap"><table><tr><th>Client</th><th>Officer</th>${showBranchBreakdown?'<th>Branch</th>':''}<th>Product</th><th>Cycle</th><th>Amount</th><th>Submitted</th><th>Stage</th><th>Days Pending</th></tr>

  const { page, totalPages, totalRows } = d.pagination;

function renderCollectionReportPage(){
  const st = session.mgrReportState || (session.mgrReportState = (()=>{ const now=new Date(); return { from:new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10), to:now.toISOString().slice(0,10), branchId:'', officerId:'', productId:'', status:'', q:'', page:1 }; })());
  if(!DB.collectionReport || DB.collectionReport.stateKey !== JSON.stringify(st)){ loadCollectionReport(); return `<div class="card"><div class="empty">Loading…</div></div>`; }
  const d = DB.collectionReport;
  const pp = d.previousPeriod;
  const trendColor = pp && pp.trend==='improved' ? 'var(--green)' : pp && pp.trend==='declined' ? 'var(--red)' : 'inherit';
  const { page, totalPages, totalRows } = d.pagination;
  const isRegional = session.role === 'Regional Manager';
  const isOperational = session.role === 'Operational Manager';
  const showBranchBreakdown = isRegional || isOperational;
  const myStaff = DB.staff.find(s=>s.id===session.userId);
  const myRegion = myStaff && myStaff.regionId ? DB.regions.find(r=>r.id===myStaff.regionId) : null;
  const statusColors = {'Paid':'#4c956c','Overpaid':'#264653','Partially Paid':'#e9c46a','Overdue':'#c1121f','Due':'#8c97b8','Not Paid':'#8c1c13'};

  return `<div class="card">
    <div class="card-title">Collection Report <small>${isRegional?`Region-wide — ${myRegion?escapeHtml(myRegion.name):''}, `:isOperational?'Company-wide — across all branches, ':''}${d.from} to ${d.to}</small></div>

    <div class="pill-row" style="margin-bottom:12px;">
      <input type="date" value="${st.from}" onchange="session.mgrReportState.from=this.value; session.mgrReportState.page=1; DB.collectionReport=null; renderApp();">
      <span>to</span>
      <input type="date" value="${st.to}" onchange="session.mgrReportState.to=this.value; session.mgrReportState.page=1; DB.collectionReport=null; renderApp();">
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Amount Due</div><div class="kpi-value">${fmt(d.expected)}</div></div>
      <div class="kpi"><div class="kpi-label">Amount Collected</div><div class="kpi-value">${fmt(d.collected)}</div></div>
      <div class="kpi"><div class="kpi-label">Outstanding</div><div class="kpi-value">${fmt(d.outstanding)}</div></div>
      <div class="kpi"><div class="kpi-label">Collection Rate</div><div class="kpi-value">${d.collectionRate.toFixed(1)}%</div></div>
      <div class="kpi"><div class="kpi-label">Overdue Amount</div><div class="kpi-value" style="color:${d.overdueAmount>0?'var(--red)':'inherit'};">${fmt(d.overdueAmount)}</div></div>
      <div class="kpi"><div class="kpi-label">Missed Collections</div><div class="kpi-value">${d.missedCollections}</div></div>
    </div>
    ${pp ? `<div class="section-note" style="color:${trendColor};">Vs comparable previous period (${pp.from} to ${pp.to}): collected ${fmt(pp.collected)}, rate ${pp.collectionRate.toFixed(1)}% — <strong>${pp.trend}</strong>${pp.collectedChangePct!==null?` (${pp.collectedChangePct>=0?'+':''}${pp.collectedChangePct.toFixed(1)}%)`:''}</div>` : ""}

    ${showBranchBreakdown && d.byBranch.length ? `
    <div class="card-title" style="font-size:14px; margin-top:16px;">Branch Performance Report</div>
    ${registerChart('chart-report-branch', {
      type:'bar', data:{ labels: d.byBranch.map(b=>branchName(b.branchId)), datasets:[{ label:'Collection Rate %', data: d.byBranch.map(b=>b.collectionRate), backgroundColor:'#264653' }] },
      options:{ responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true, max:100}} }
    })}
    <div class="table-wrap"><table><tr><th>Branch</th><th>Expected</th><th>Collected</th><th>Outstanding</th><th>Rate</th><th>Paid</th><th>Partial</th><th>Not Paid</th><th>Overdue Amt</th></tr>
    ${d.byBranch.slice().sort((a,b)=>b.collectionRate-a.collectionRate).map(b=>`<tr class="clickable" onclick="session.mgrReportState.branchId='${b.branchId}'; session.mgrReportState.page=1; DB.collectionReport=null; renderApp();"><td>${branchName(b.branchId)}</td><td>${fmt(b.expected).replace('KES ','')}</td><td>${fmt(b.collected).replace('KES ','')}</td><td>${fmt(b.outstanding).replace('KES ','')}</td><td>${b.collectionRate.toFixed(1)}%</td><td>${b.clientsPaid}</td><td>${b.clientsPartial}</td><td>${b.clientsNotPaid}</td><td style="color:${b.overdueAmount>0?'var(--red)':'inherit'};">${fmt(b.overdueAmount).replace('KES ','')}</td></tr>`).join("") || `<tr><td colspan="9" class="empty">No data.</td></tr>`}</table></div>
    ${st.branchId ? `<button class="btn btn-sm btn-outline" style="margin-top:8px;" onclick="session.mgrReportState.branchId=''; session.mgrReportState.page=1; DB.collectionReport=null; renderApp();">← All Branches</button>` : ""}

    <div class="pill-row" style="margin:14px 0;">
      ${showBranchBreakdown ? `<select onchange="session.mgrReportState.branchId=this.value; session.mgrReportState.page=1; DB.collectionReport=null; renderApp();">

        ${DB.branches.map(b=>`<option value="${b.id}" ${b.id===st.branchId?'selected':''}>${escapeHtml(b.name)}</option>`).join("")}

      <select onchange="session.mgrReportState.officerId=this.value; session.mgrReportState.page=1; DB.collectionReport=null; renderApp();">
        <option value="">-- Loan Officer --</option>
        ${DB.staff.filter(s2=>s2.role==='Loan Officer').map(o=>`<option value="${o.id}" ${o.id===st.officerId?'selected':''}>${escapeHtml(o.name)}</option>`).join("")}
      </select>
      <select onchange="session.mgrReportState.productId=this.value; session.mgrReportState.page=1; DB.collectionReport=null; renderApp();">

      </select>
      <input placeholder="Search client, loan" value="${escapeHtml(st.q)}" oninput="session.mgrReportState.q=this.value; session.mgrReportState.page=1; DB.collectionReport=null; renderApp();">
      ${(st.branchId||st.officerId||st.productId||st.status||st.q) ? `<button class="btn btn-sm btn-outline" onclick="session.mgrReportState={from:st.from,to:st.to,branchId:'',officerId:'',productId:'',status:'',q:'',page:1}; DB.collectionReport=null; renderApp();">Reset Filters</button>` : ""}
      <button class="btn btn-sm btn-outline" style="margin-left:auto;" onclick="exportCollectionReport()">Export CSV</button>

    <div class="two-col">
      <div>
        <div class="card-title" style="font-size:14px;">Officer Performance</div>
        <div class="table-wrap"><table><tr><th>Officer</th><th>Expected</th><th>Collected</th><th>Rate</th></tr>
        ${d.byOfficer.slice().sort((a,b)=>b.expected-a.expected).map(o=>`<tr><td>${staffName(o.officerId)}</td><td>${fmt(o.expected).replace('KES ','')}</td><td>${fmt(o.collected).replace('KES ','')}</td><td>${o.collectionRate.toFixed(1)}%</td></tr>`).join("") || `<tr><td colspan="4" class="empty">No data.</td></tr>`}</table></div>
      </div>
      <div>
        <div class="card-title" style="font-size:14px;">Product Performance</div>
        <div class="table-wrap"><table><tr><th>Product</th><th>Expected</th><th>Collected</th><th>Rate</th></tr>

    <div class="card-title" style="font-size:14px; margin-top:16px;">Daily Collection Trend</div>

    ${d.exceptions && d.exceptions.length ? `

    ${d.exceptions.map(e=>`<tr class="clickable" onclick="openLoan('${e.loanId}')"><td>${escapeHtml(e.clientName)}</td><td>${staffName(e.officerId)}</td>${showBranchBreakdown?`<td>${branchName(e.branchId)}</td>`:''}<td style="color:var(--red);">${fmt(e.outstanding).replace('KES ','')}</td><td>${e.daysOverdue}d</td></tr>`).join("")}</table></div>
