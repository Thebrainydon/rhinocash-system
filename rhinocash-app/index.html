async function mgrLookupClient(q){
  if(!q || q.length < 2) return;
  return withRequest('mgr-client-lookup', async ()=>{
    const res = await api.get('/api/clients?q='+encodeURIComponent(q)+'&limit=10');
    session.mgrCreateAppState.matchedClients = res.clients;
  });
}
function mgrSelectClient(clientId){
  const c = session.mgrCreateAppState.matchedClients.find(x=>x.id===clientId);
  session.mgrCreateAppState.selectedClient = c || null;
  renderApp();
}
function mgrClearClient(){
  session.mgrCreateAppState.selectedClient = null;
  session.mgrCreateAppState.officerId = '';
  renderApp();
}
async function submitMgrLoanApp(){
  const st = session.mgrCreateAppState;
  if(!st.selectedClient){ toast('Select a client first'); return; }
  if(!st.officerId){ toast('Select a loan officer'); return; }
  if(!st.productId || !st.principal || !st.term){ toast('Complete the loan product, amount and duration'); return; }
  return withRequest('submit-mgr-loan', async ()=>{
    await createLoanApplication({ clientId: st.selectedClient.id, officerId: st.officerId, productId: st.productId, principal: st.principal, term: st.term, purpose: st.purpose, guarantor: st.guarantor, guarantor_contact: st.guarantorContact, loan_securities: st.loanSecurities, loan_category: st.loanCategory });
    toast('Loan application submitted');
    session.mgrCreateAppState = null;
    goTo('loanbook','Loan Applications');
  });
}

async function rmLookupClient(q){
  const st = session.rmCreateAppState;
  if(!q || q.length < 2 || !st.branchId) return;
  return withRequest('rm-client-lookup', async ()=>{
    const res = await api.get('/api/clients?q='+encodeURIComponent(q)+'&branch_id='+encodeURIComponent(st.branchId)+'&limit=10');
    session.rmCreateAppState.matchedClients = res.clients;
  });
}
function rmSelectClient(clientId){
  const c = session.rmCreateAppState.matchedClients.find(x=>x.id===clientId);
  session.rmCreateAppState.selectedClient = c || null;
  renderApp();
}
function rmClearClient(){
  session.rmCreateAppState.selectedClient = null;
  session.rmCreateAppState.officerId = '';
  renderApp();
}
async function submitRmLoanApp(){
  const st = session.rmCreateAppState;
  if(!st.branchId){ toast('Select a branch first'); return; }
  if(!st.selectedClient){ toast('Select a client first'); return; }
  if(!st.officerId){ toast('Select a loan officer'); return; }
  if(!st.productId || !st.principal || !st.term){ toast('Complete the loan product, amount and duration'); return; }
  return withRequest('submit-rm-loan', async ()=>{
    await createLoanApplication({ clientId: st.selectedClient.id, branchId: st.branchId, officerId: st.officerId, productId: st.productId, principal: st.principal, term: st.term, purpose: st.purpose, guarantor: st.guarantor, guarantor_contact: st.guarantorContact, loan_securities: st.loanSecurities, loan_category: st.loanCategory });
    toast('Loan application submitted');
    session.rmCreateAppState = null;
    goTo('loanbook','Loan Applications');
  });
}

async function loadApplicationsOverview(){
  const st = session.mgrAppOverviewState;
  return withRequest('load-applications-overview', async ()=>{
    const params = new URLSearchParams();
    if(st.branchId) params.set('branch_id', st.branchId);
    if(st.officerId) params.set('officer_id', st.officerId);
    if(st.productId) params.set('product_id', st.productId);
    if(st.status) params.set('status', st.status);
    if(st.cycle) params.set('cycle', st.cycle);
    if(st.from) params.set('from', st.from);
    if(st.to) params.set('to', st.to);
    if(st.minAmount) params.set('min_amount', st.minAmount);
    if(st.maxAmount) params.set('max_amount', st.maxAmount);
    if(st.q) params.set('q', st.q);
    params.set('page', st.page||1);
    params.set('page_size', 15);
    DB.applicationsOverview = await api.get('/api/loans/applications-overview?'+params.toString());
    DB.applicationsOverview.stateKey = JSON.stringify(st);
  });
}
async function exportApplicationsOverview(){
  const st = session.mgrAppOverviewState;
  return withRequest('export-applications-overview', async ()=>{
    const params = new URLSearchParams();
    if(st.branchId) params.set('branch_id', st.branchId);
    if(st.officerId) params.set('officer_id', st.officerId);
    if(st.productId) params.set('product_id', st.productId);
    if(st.status) params.set('status', st.status);
    if(st.cycle) params.set('cycle', st.cycle);
    if(st.from) params.set('from', st.from);
    if(st.to) params.set('to', st.to);
    if(st.q) params.set('q', st.q);
    params.set('export', 'true');
    const full = await api.get('/api/loans/applications-overview?'+params.toString());

  });
}

function sheetBranchFilterKey(st){
  // expandedOfficers is a pure client-side UI toggle (which officer groups
  // are expanded), not a data filter — it must never be part of the key
  // that decides whether cached collection-sheet data needs reloading.
  const { expandedOfficers, ...filters } = st;
  return JSON.stringify(filters);
}
async function loadSheetBranch(){
  const st = session.mgrSheetState;
  // Keyed by state, not a bare string — a fixed key would let withRequest's
  // duplicate-call guard silently drop a fresh request for a NEW filter
  // state just because an older, now-superseded request (different date/
  // officer/etc.) was still in flight, leaving DB.sheetBranch stuck on
  // stale data until that old call finally resolved.
  return withRequest('load-sheet-branch:'+sheetBranchFilterKey(st), async ()=>{
    const params = new URLSearchParams();
    if(st.date) params.set('date', st.date);
    if(st.branchId) params.set('branch_id', st.branchId);
    if(st.officerId) params.set('officer_id', st.officerId);
    if(st.productId) params.set('product_id', st.productId);
    if(st.status) params.set('status', st.status);
    if(st.q) params.set('q', st.q);
    DB.sheetBranch = await api.get('/api/collections/sheet-branch?'+params.toString());
    DB.sheetBranch.stateKey = sheetBranchFilterKey(st);
  });
}

// ---- Real, server-paginated payment list views ----
// One shared loader + pagination control for every payment list page
// (Processed Payments, Prepayments, Payments Report) — real filtering and
// counting happen server-side (GET /api/payments), never "fetch everything
// and slice it in JS." DB.paymentsPages holds one independent {payments,
// pagination, totals, filters} entry per page-key so switching tabs
// doesn't clobber another tab's current page/filters.
// (paymentsPages lives on the main DB init object below, not initialized here)
function paymentsQueryString(filters, page, limit){
  const params = new URLSearchParams();
  Object.entries(filters||{}).forEach(([k,v])=>{ if(v) params.set(k, v); });
  params.set('page', page||1); params.set('limit', limit||25);
  return params.toString();
}
async function loadPaymentsPage(pageKey, filters, page){
  return withRequest('load-'+pageKey, async ()=>{
    const qs = paymentsQueryString(filters, page, 25);
    const res = await api.get('/api/payments?'+qs);
    DB.paymentsPages[pageKey] = { ...res, filters: filters||{}, page: res.pagination.page };
  });
}
function renderPaginationControls(pageKey, loaderFnName, filters){
  const state = DB.paymentsPages[pageKey] || DB.acctPages[pageKey];
  if(!state) return "";
  const p = state.pagination;
  // Most backend list endpoints return {page, limit, total, totalPages}
  // without explicit hasPrev/hasNext booleans — only payments.js includes
  // them. Compute a safe fallback here so Previous/Next work correctly
  // everywhere this helper is reused, instead of silently defaulting
  // both buttons to permanently disabled.
  const hasPrev = p.hasPrev !== undefined ? p.hasPrev : p.page > 1;
  const hasNext = p.hasNext !== undefined ? p.hasNext : p.page < p.totalPages;

// Accounting tabs are derived per-role from the role's own sidebar, instead
// of one hardcoded 14-tab bar shown to everyone: a role only sees the tabs
// its sidebar actually promises it (e.g. Loan Officer's Accounting section
// lists only Requisitions/Utility Payments/Cashflow). Roles with the
// "Post Accounting Entries" permission (Admin, Accountant) keep full access
// to every accounting page, including the ones with no sidebar entry yet.
const ALL_ACCOUNTING_TABS = ["Expenses","Requisitions","Utility Payments","General Ledger","Chart of Accounts","Trial Balance","Profit & Loss","Balance Sheet","Cashflow","Accounting Periods","Adjustments","Portfolio at Risk","Branch Profitability","Approval Aging"];
function accountingTabsForRole(role){
  if(CAN_POST_ACCOUNTING(role)) return ALL_ACCOUNTING_TABS;
  const menu = SIDEBAR_MENUS[role] || [];
  const reachable = new Set();
  menu.forEach(sec => (sec.items||[]).forEach(label => {
    const route = resolveRoute(label);
    if(route && route.section === 'accounting' && route.subtab) reachable.add(route.subtab);
  }));
  return ALL_ACCOUNTING_TABS.filter(t => reachable.has(t));
}
function renderAccounting(){
  const tabs = accountingTabsForRole(session.role);
  const active = (session.subtab && tabs.includes(session.subtab)) ? session.subtab : (tabs[0] || "Expenses");
  const tabsHtml = `<div class="subtabs">${tabs.map(t=>`<div class="subtab ${active===t?'active':''}" onclick="goTo('accounting','${t}')">${t}</div>`).join("")}</div>`;
  if(active==="Requisitions") return DB.requisitionForm ? renderCreateRequisitionPage() : renderRequisitionsPage();
  if(active==="Utility Payments") return DB.utilPaymentForm ? renderCreateUtilityPaymentPage() : renderUtilityPaymentsPage();
  if(active==="General Ledger") return tabsHtml + renderGeneralLedgerPage();
  if(active==="Chart of Accounts") return tabsHtml + renderChartOfAccountsPage();
  if(active==="Trial Balance") return tabsHtml + renderTrialBalancePage();
  if(active==="Profit & Loss") return tabsHtml + renderProfitLossPage();
  if(active==="Balance Sheet") return tabsHtml + renderBalanceSheetPage();
  if(active==="Cashflow") return session.role==='Loan Officer' ? renderExpectedCashflowPage() : tabsHtml + renderCashflowPage();
  if(active==="Accounting Periods") return tabsHtml + renderAccountingPeriodsPage();
  if(active==="Adjustments") return tabsHtml + renderAdjustmentsPage();
  if(active==="Portfolio at Risk") return tabsHtml + renderPARPage();
  if(active==="Branch Profitability") return tabsHtml + renderBranchProfitabilityPage();
  if(active==="Approval Aging") return tabsHtml + renderApprovalAgingPage();
  return tabsHtml + renderExpensesPage();
}

// ---- Bulk Upload (Import Utility Payments): a real CSV parse + the same
// OTP confirmation code used elsewhere in Accounting, not a second scheme.
// True binary .xlsx parsing needs a library this dependency-free backend
// doesn't carry, so a non-CSV file is honestly rejected client-side rather
// than pretending to read it — matching this app's NOT_CONFIGURED convention.
const BULK_UPLOAD_COLUMNS = ["branch","item_description","cost","recipient_mpesa_number","mpesa_name","journal_account"];
function openBulkUploadModal(){
  DB.bulkUploadForm = { fileName:"", rows:null, parseError:null, otp_code:"", otpRequested:false, otpForTesting:null };
  openModal('bulk-upload-utility');
}
function parseBulkUploadCsv(text){
  const lines = text.split(/\r\n|\n|\r/).filter(l=>l.trim().length);
  if(lines.length < 2) return { rows:[], error:"The file has no data rows below the header." };
  const splitLine = l => l.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
  const dataLines = lines.slice(1); // first line is the header row
  const rows = dataLines.map(l=>{
    const cells = splitLine(l);
    const row = {};
    BULK_UPLOAD_COLUMNS.forEach((key,i)=>{ row[key] = (cells[i]||'').trim(); });
    return row;
  }).filter(r=>r.item_description || r.cost);
  return { rows, error:null };
}
function handleBulkUploadFileChange(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const f = DB.bulkUploadForm;
  f.fileName = file.name;
  f.rows = null; f.parseError = null;
  if(!/\.csv$/i.test(file.name)){
    f.parseError = "This build can only parse .csv files — export your filled Excel template as CSV (File → Save As → CSV) and select that file instead.";
    renderApp(); return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const { rows, error } = parseBulkUploadCsv(String(reader.result||''));
    f.rows = rows; f.parseError = error;
    renderApp();
  };
  reader.onerror = () => { f.parseError = "Could not read that file."; renderApp(); };
  reader.readAsText(file);
  renderApp();
}
function requestBulkUploadOtp(){
  return withRequest('bulk-otp', async ()=>{
    const res = await api.post('/api/requisitions/request-otp', {});
    DB.bulkUploadForm.otpRequested = true;
    DB.bulkUploadForm.otpForTesting = res.otpForTesting || null;
    toast(res.status === 'NOT_CONFIGURED' ? "SMS isn't configured here — using the test code shown below" : "OTP sent to your M-Pesa number");
  });
}
function submitBulkUpload(){
  const f = DB.bulkUploadForm;
  if(!f.rows || !f.rows.length){ toast("Choose a filled CSV file first"); return; }
  if(!f.otp_code){ toast("Enter the OTP code sent to your M-Pesa number"); return; }
  return withRequest('bulk-upload', async ()=>{
    const res = await api.post('/api/utility-payments/bulk', { rows:f.rows, otp_code:f.otp_code });
    toast(res.errors && res.errors.length
      ? `Imported ${res.created} of ${f.rows.length} row(s) — ${res.errors.length} failed (see console for details)`
      : `Imported all ${res.created} row(s) successfully`);
    if(res.errors && res.errors.length) console.error('Bulk upload row errors:', res.errors);
    if(res.created > 0){ closeModal(); await loadUtilityPayments(DB.acctPages.util?DB.acctPages.util.filters:{}); }
  });
}

  const f = DB.bulkUploadForm;
  return `

// ==================== Expected Cashflow (Loan Officer) — real, month/week/day-scoped ====================
// Reuses the same "outstanding" definition (loan_schedule rows not yet
// Paid) as arrears elsewhere — a genuine projection of what's still due,
// never a fabricated forecast number.
function expectedCfMonthOptions(){
  const opts = []; const now = new Date();
  for(let i=-2;i<=12;i++){
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    opts.push(d.toISOString().slice(0,7));
  }
  return opts;
}
function expectedCfMonthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleString('en-KE', {month:'short', year:'numeric'});
}
function expectedCfWeeksInMonth(ym){
  const [y,m] = ym.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const weeks = []; let day = 1;
  while(day <= daysInMonth){ const end = Math.min(day+6, daysInMonth); weeks.push({start:day, end}); day = end+1; }
  return weeks;
}
let expectedCfReqSeq = 0;
function loadExpectedCashflow(){
  const st = session.expectedCashflowState;
  const seq = ++expectedCfReqSeq;
  return withRequest('load-expected-cf:'+JSON.stringify(st), async ()=>{
    const params = new URLSearchParams();
    if(st.day) params.set('day', st.day);
    else if(st.week!==''){
      const wk = expectedCfWeeksInMonth(st.month)[Number(st.week)];
      params.set('week_start', `${st.month}-${String(wk.start).padStart(2,'0')}`);
      params.set('week_end', `${st.month}-${String(wk.end).padStart(2,'0')}`);
    } else params.set('month', st.month);
    const res = await api.get('/api/collections/expected-cashflow?'+params.toString());
    if(seq !== expectedCfReqSeq) return; // a newer request has since superseded this one
    res.stateKey = JSON.stringify(st);
    DB.expectedCashflowData = res;
  });
}
// Each handler only updates the filter state and re-renders — the render
// function itself detects the stateKey mismatch and (re)loads, exactly
// once, the same pattern the Loan Status Browser uses. Calling
// loadExpectedCashflow() again here too would race the load the render
// pass is about to trigger anyway (withRequest's duplicate-call guard
// would silently drop whichever call loses that race).
function changeExpectedCfMonth(value){
  session.expectedCashflowState = { month:value, week:'', day:'' };
  renderApp();
}
function changeExpectedCfWeek(value){
  session.expectedCashflowState.week = value; session.expectedCashflowState.day = '';
  renderApp();
}
function changeExpectedCfDay(value){
  session.expectedCashflowState.day = value;
  renderApp();
}
function renderExpectedCashflowPage(){
  if(!session.expectedCashflowState){
    session.expectedCashflowState = { month: new Date().toISOString().slice(0,7), week:'', day:'' };
  }
  const st = session.expectedCashflowState;
  if(!DB.expectedCashflowData || DB.expectedCashflowData.stateKey !== JSON.stringify(st)){ loadExpectedCashflow(); return `<div class="card"><div class="empty">Loading…</div></div>`; }
  const data = DB.expectedCashflowData;
  const weeks = expectedCfWeeksInMonth(st.month);
  const [y,m] = st.month.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthAbbrev = expectedCfMonthLabel(st.month).split(' ')[0];
  return `
    <div class="card">
      <h3 style="color:var(--navy); margin-bottom:12px;">${expectedCfMonthLabel(st.month)} Expected Cashflow</h3>
      <div style="border-bottom:1px solid var(--line); margin-bottom:16px;"></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
        <select style="flex:1; min-width:130px;" onchange="changeExpectedCfMonth(this.value)">
          ${expectedCfMonthOptions().map(ym=>`<option value="${ym}" ${st.month===ym?'selected':''}>${expectedCfMonthLabel(ym)}</option>`).join("")}
        </select>
        <select style="flex:1; min-width:150px;" onchange="changeExpectedCfWeek(this.value)">
          <option value="">-- Select week --</option>
          ${weeks.map((w,idx)=>`<option value="${idx}" ${st.week===String(idx)?'selected':''}>Week ${idx+1} (${monthAbbrev} ${w.start}–${w.end})</option>`).join("")}
        </select>
      </div>
      <select style="width:160px; margin-bottom:24px;" onchange="changeExpectedCfDay(this.value)">
        <option value="">-- Day --</option>
        ${Array.from({length:daysInMonth}, (_,i)=>i+1).map(d=>{
          const dateStr = `${st.month}-${String(d).padStart(2,'0')}`;
          return `<option value="${dateStr}" ${st.day===dateStr?'selected':''}>${d}</option>`;
        }).join("")}
      </select>
      <div class="card-title" style="color:var(--blue);">Loan Summary</div>
      <table>
        <tr style="background:#F5F4F1;"><td>Total Loans</td><td style="text-align:right;"><strong>${data.totalLoans}</strong></td></tr>
        <tr><td>Loan Principal</td><td style="text-align:right;"><strong>${fmtNum(data.principal)}</strong> KES</td></tr>
        <tr style="background:#F5F4F1;"><td>Loan Interest</td><td style="text-align:right;"><strong>${fmtNum(data.interest)}</strong> KES</td></tr>
      </table>
      <div style="text-align:right; padding-top:10px; border-top:1px solid var(--line); margin-top:6px; color:var(--blue); font-weight:700; font-size:15px;">${fmtNum(data.total)} KES</div>
    </div>
  `;
}

async function loadRegions(filters){
  return withRequest('load-regions', async ()=>{
    const params = new URLSearchParams(); Object.entries(filters||{}).forEach(([k,v])=>{ if(v) params.set(k,v); });
    const res = await api.get('/api/regions?'+params.toString());
    DB.acctPages.regions = { regions: res.regions, filters: filters||{} };
    DB.regions = res.regions; // keep the shared reference fresh for dropdowns elsewhere
  });
}
function renderRegionsPage(){
  const state = DB.acctPages.regions;

async function loadReportsData(){
  return withRequest('load-reports', async ()=>{
    const canFinancial = ['Accountant','Admin','CEO','Director'].includes(session.role);
    const canBranchRanking = ['CEO','Director','Regional Manager','Operational Manager','Admin'].includes(session.role);
    const canOfficerComparison = ['Manager','Admin','Regional Manager','Operational Manager'].includes(session.role);
    const calls = [
      api.get('/api/reports/portfolio').catch(()=>null),
      api.get('/api/reports/collections').catch(()=>null),
      api.get('/api/reports/targets').catch(()=>null),
      canFinancial ? api.get('/api/reports/financial').catch(()=>null) : Promise.resolve(null),
      canBranchRanking ? api.get('/api/reports/branch-ranking').catch(()=>null) : Promise.resolve(null),
      canBranchRanking ? api.get('/api/reports/growth').catch(()=>null) : Promise.resolve(null),
      canOfficerComparison ? api.get('/api/collections/officer-comparison').catch(()=>null) : Promise.resolve(null),
      api.get('/api/report-filter-presets').catch(()=>null),
    ];
    const [portfolio, collections, targets, financial, branchRanking, growth, officerComparison, presets] = await Promise.all(calls);
    DB.reportsData = { portfolio, collections, targets, financial, branchRanking, growth, officerComparison };
    DB.reportPresets = presets ? presets.presets : [];
  });
}

function renderReportsInsights(d){
  const insights = [];
  if(d.collections && d.collections.rate < 70 && d.collections.expected > 0) insights.push(`Collection rate is ${d.collections.rate.toFixed(1)}% — below the 70% healthy threshold.`);
  if(d.portfolio){ const par30 = (d.portfolio.par.find(p=>p.threshold===30)||{percentage:0}).percentage; if(par30 > 10) insights.push(`PAR 30 is ${par30.toFixed(1)}% — elevated portfolio risk.`); }
  if(d.targets && d.targets.targets.length && d.targets.achievementPct < 50) insights.push(`Target achievement is ${d.targets.achievementPct.toFixed(1)}% — significantly behind.`);
  if(d.branchRanking && d.branchRanking.branches.length > 1){
    const sorted = [...d.branchRanking.branches].sort((a,b)=>b.collectionRate-a.collectionRate);
    insights.push(`${sorted[0].branchName} has the highest collection rate in scope (${sorted[0].collectionRate.toFixed(1)}%).`);
  }
  if(!insights.length) return "";
  return `<div class="card"><div class="card-title">Insights</div>${insights.map(i=>`<div class="hint" style="padding:4px 0;">• ${escapeHtml(i)}</div>`).join("")}</div>`;
}

/* ---------- 8. Audit Logs ---------- */
function renderAudit(){
  const filter = session.subtab || "All";
  const filterMap = {
    "All": ()=>true,
    "Login Activity": l=>l.action.toLowerCase().includes("login") || l.action.toLowerCase().includes("logged in"),
    "Access Audit Trail": l=>l.entity==="Access Control",
    "Permission History": l=>l.entity==="Permissions" || l.entity==="Access Control",
    "Security Events": l=>l.entity==="Security",
  };
  const filtered = DB.auditLog.filter(filterMap[filter] || filterMap["All"]).slice(0,150);
  const tabs = Object.keys(filterMap);
  const rows = filtered.map(l=>`<tr><td>${new Date(l.date).toLocaleString()}</td><td>${escapeHtml(l.user)}</td>
    <td><span class="badge blue">${l.role}</span></td><td>${escapeHtml(l.action)}</td><td>${l.entity}</td><td>${escapeHtml(l.details||"")}</td></tr>`).join("");
  return `
    <div class="section-note">Immutable record of user activity, financial actions and system changes — for accountability and regulatory review.</div>
    <div class="subtabs">${tabs.map(t=>`<div class="subtab ${filter===t?'active':''}" onclick="goTo('audit','${t}')">${t}</div>`).join("")}</div>
    <div class="card"><div class="card-title">${filter} <small>${filtered.length} of ${DB.auditLog.length} entries</small></div>
      <div class="table-wrap"><table><tr><th>Timestamp</th><th>User</th><th>Role</th><th>Action</th><th>Entity</th><th>Details</th></tr>
      ${rows || `<tr><td colspan="6" class="empty">No matching activity yet.</td></tr>`}</table></div>
    </div>
  `;
}

// ---- Staff Directory — real server-side search/filter/pagination ----
async function loadStaffDirectory(filters, page){
  return withRequest('load-staffdir', async ()=>{
    const params = new URLSearchParams(); Object.entries(filters||{}).forEach(([k,v])=>{ if(v) params.set(k,v); }); params.set('page',page||1); params.set('limit',25);
    const res = await api.get('/api/users?'+params.toString());
    DB.acctPages.staffdir = { staff: res.users.map(adaptStaff), pagination: res.pagination, filters: filters||{}, page: res.pagination.page };
  });
}
function submitStaffDirFilter(ev){
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  Object.keys(f).forEach(k=>{ if(!f[k]) delete f[k]; });
  return loadStaffDirectory(f, 1);
}

// ---- Target Management — real, for every role the backend actually lets
// set targets (Manager -> Loan Officer, Regional Manager -> Manager,
// Operational Manager -> Regional Manager, CEO/Director -> management
// levels). This is the ONE target-setting UI, not a copy per role — the
// eligible-recipient list and scope enforcement come from the real API,
// so the same form is correct for whichever role is looking at it.
const TARGET_METRIC_LABELS = { disbursement:"Disbursement", new_loans:"New Loans", collection:"Collection", collection_rate:"Collection Rate", portfolio:"Portfolio", new_clients:"New Clients" };
function renderTargetManagement(){
  if(!['Manager','Regional Manager','Operational Manager','CEO','Director','Admin'].includes(session.role)) return "";
  const myTargets = DB.targets.filter(t=>t.setBy===(DB.me&&DB.me.id));
  const recipients = DB.targetEligibleRecipients||[];
  const recipientLabel = (t)=> t.recipientUserId ? staffName(t.recipientUserId) : (t.branchId ? branchName(t.branchId) + ' (branch)' : (t.regionId ? (DB.regions.find(r=>r.id===t.regionId)||{}).name + ' (region)' : '—'));
  const showHistory = session.subtab === "Target History";
  return `
    <div class="card">
      <div class="card-title">Target Management <small>set real performance targets for your team — visible on their own dashboard the moment you save</small></div>
      ${recipients.length ? `
      <form onsubmit="return submitSetTarget(event)">
        <div class="form-grid">
          <div class="field"><label>Recipient</label><select name="recipient_user_id" required>${recipients.map(u=>`<option value="${u.id}">${escapeHtml(u.name)} (${ROLE_ID_TO_DISPLAY[u.role_id]||u.role_id})</option>`).join("")}</select></div>
          <div class="field"><label>Metric</label><select name="metric" required>${Object.entries(TARGET_METRIC_LABELS).map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></div>
          <div class="field"><label>Period (YYYY-MM)</label><input name="period" value="${currentPeriodKey()}" required></div>
          <div class="field"><label>Target Value</label><input name="target_value" type="number" min="1" required></div>
        </div>
        <div class="field"><label>Notes (optional)</label><input name="notes"></div>
        <button class="btn btn-primary btn-sm" type="submit">Set Target</button>
      </form>
      ` : `<div class="empty">No eligible staff in your scope to set targets for right now.</div>`}
    </div>
    <div class="card">
      <div class="subtabs">
        <div class="subtab ${!showHistory?'active':''}" onclick="goTo('staff','Manage Targets')">Manage Targets</div>
        <div class="subtab ${showHistory?'active':''}" onclick="loadTargetHistory()">Target History</div>
      </div>
      <div class="card-title" style="margin-top:10px;">${showHistory?'Target History':'Targets You\'ve Set'} <small>${showHistory ? 'includes cancelled — real historical achievement preserved' : myTargets.length + ' active'}</small></div>
      <div class="table-wrap"><table><tr><th>Recipient</th><th>Metric</th><th>Period</th><th>Target</th><th>Achieved</th><th>Remaining</th><th>Achievement %</th><th>Status</th><th></th></tr>
      ${(showHistory ? (DB.targetHistory||[]) : myTargets).map(t=>`<tr>
        <td>${recipientLabel(t)}</td><td>${TARGET_METRIC_LABELS[t.metric]||t.metric}</td><td>${t.period}</td><td>${fmtNum(t.value)}</td>
        <td>${fmtNum(t.achieved||0)}</td><td>${fmtNum(t.remaining||0)}</td>
        <td><span class="badge ${(t.achievementPct||0)>=100?'green':(t.achievementPct||0)>=50?'amber':'red'}">${(t.achievementPct||0).toFixed(1)}%</span></td>
        <td><span class="badge ${t.status==='Active'?'green':'grey'}">${t.status}</span></td>
        <td>${(!showHistory && t.status==='Active') ? `<button class="btn btn-sm btn-outline" onclick="if(confirm('Cancel this target?')) withRequest('cancel-target', ()=>cancelTargetAction('${t.id}'))">Cancel</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="9" class="empty">${showHistory?'No historical targets yet.':'You haven\'t set any targets yet.'}</td></tr>`}</table></div>
    </div>
  `;
}
async function loadTargetHistory(){
  session.subtab = "Target History"; renderApp();
  return withRequest('target-history', async ()=>{
    const res = await api.get('/api/targets?history=1');
    DB.targetHistory = res.targets.map(adaptTarget);
  });
}
async function setTarget(data){
  const res = await api.post('/api/targets', { metric:data.metric, recipient_user_id:data.recipient_user_id||undefined,
    branch_id:data.branch_id||undefined, region_id:data.region_id||undefined,
    target_value:Number(data.target_value), period:data.period, period_type:data.period_type||undefined, notes:data.notes||null });
  const t = adaptTarget(res.target);
  DB.targets.unshift(t);
  return t;
}
function submitSetTarget(ev){
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  return withRequest('set-target', async ()=>{
    await setTarget(f);
    toast("Target set");
  });
}
async function cancelTargetAction(id){
  await api.post(`/api/targets/${id}/cancel`, {});
  DB.targets = DB.targets.filter(t=>t.id!==id);
  toast("Target cancelled");
}
function submitStaff(ev){
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  return withRequest('add-staff', async ()=>{
    const { staff: s, tempPassword } = await addStaffMember(f);
    if(tempPassword) alert(`${s.name} created as ${s.role}.\n\nTemporary password: ${tempPassword}\n\nThis is shown once — share it securely.`);
    else toast("Staff member added");
    await loadStaffDirectory(DB.acctPages.staffdir?DB.acctPages.staffdir.filters:{}, 1);
  });
}

async function loadSupportTickets(filters, page){

    const params = new URLSearchParams(); Object.entries(filters||{}).forEach(([k,v])=>{ if(v) params.set(k,v); }); params.set('page',page||1); params.set('limit',25);
    const res = await api.get('/api/support-tickets?'+params.toString());
    DB.acctPages.tickets = { tickets: res.tickets.map(adaptTicket), pagination: res.pagination, filters: filters||{}, page: res.pagination.page };
  });

function submitTicketFilter(ev){ ev.preventDefault(); const f=Object.fromEntries(new FormData(ev.target)); Object.keys(f).forEach(k=>{if(!f[k])delete f[k];}); return loadSupportTickets(f,1); }

function exportTickets(){
  return withRequest('export-tickets', async ()=>{
    const filters = DB.acctPages.tickets ? DB.acctPages.tickets.filters : {};
    const params = new URLSearchParams(); Object.entries(filters).forEach(([k,v])=>{ if(v) params.set(k,v); });
    const res = await api.get('/api/support-tickets/export?'+params.toString());
    exportCSV('support_tickets', ['ID','Subject','Category','Priority','Status','SLA','Raised By','Assigned To','Created'],
      res.tickets.map(t=>[t.id, t.subject, t.category, t.priority, t.status, t.sla?t.sla.status:'', staffName(t.created_by), t.assigned_to?staffName(t.assigned_to):'Unassigned', t.created_at]));
  });
}

async function loadTicketPresets(){
  return withRequest('load-presets', async ()=>{ const r = await api.get('/api/ticket-filter-presets'); DB.ticketPresets = r.presets; });
}
function applyTicketPreset(id){
  const preset = (DB.ticketPresets||[]).find(p=>p.id===id);
  if(!preset) return;
  const filters = JSON.parse(preset.filters_json);
  loadSupportTickets(filters, 1);
}
function submitSaveTicketPreset(){
  const name = prompt("Name this filter preset:");
  if(!name) return;
  const filters = DB.acctPages.tickets ? DB.acctPages.tickets.filters : {};
  return withRequest('save-preset', async ()=>{
    await api.post('/api/ticket-filter-presets', { name, filters });
    toast("Filter preset saved");
    await loadTicketPresets();
  });
}
async function deleteTicketPreset(id){
  await api.del(`/api/ticket-filter-presets/${id}`);
  toast("Preset removed");
  await loadTicketPresets();
}

function slaBadge(sla){
  if(!sla) return "";
  const map = { ON_TRACK:'green', DUE_SOON:'amber', OVERDUE:'red', RESOLVED:'grey' };
  const label = { ON_TRACK:'On Track', DUE_SOON:'Due Soon', OVERDUE:'Overdue', RESOLVED:'Resolved' };
  return `<span class="badge ${map[sla.status]||'grey'}">${label[sla.status]||sla.status}</span>`;
}

function submitTicket(ev){
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));

    await api.post('/api/support-tickets', f);
    toast("Support ticket submitted");
    DB.ticketDashboard = null;
    await loadSupportTickets(DB.acctPages.tickets?DB.acctPages.tickets.filters:{}, 1);
  });
}
function openTicketDetail(id){ session.selectedTicketId = id; DB.ticketDetail = null; renderApp(); loadTicketDetail(id); }

async function loadTicketDetail(id){

function renderTicketDetail(id){
  const d = DB.ticketDetail;

// ==================== FAQ / Knowledge Base ====================
async function loadFaq(filters){
  return withRequest('load-faq', async ()=>{
    const params = new URLSearchParams(); Object.entries(filters||{}).forEach(([k,v])=>{ if(v) params.set(k,v); });
    const res = await api.get('/api/faq?'+params.toString());
    DB.faqArticles = { articles: res.articles, filters: filters||{} };
  });
}
function submitFaqFilter(ev){ ev.preventDefault(); const f=Object.fromEntries(new FormData(ev.target)); Object.keys(f).forEach(k=>{if(!f[k])delete f[k];}); return loadFaq(f); }
function renderFaqPage(){
  const state = DB.faqArticles;
  if(!state){ loadFaq({}); return `<div class="card"><div class="empty">Loading…</div></div>`; }
  const canManage = session.role === 'Admin';
  return `
    <div class="card">
      <div class="card-title">FAQ / Knowledge Base <small>${state.articles.length} article(s)</small></div>
      <form onsubmit="return submitFaqFilter(event)" class="pill-row" style="margin-bottom:12px;">
        <input name="q" placeholder="Search questions/answers" value="${escapeHtml(state.filters.q||'')}">
        <button class="btn btn-sm btn-outline" type="submit">Apply</button>
      </form>
      ${state.articles.map(a=>`<div style="padding:12px 0; border-bottom:1px solid var(--line);">
        <strong>${escapeHtml(a.question)}</strong> <span class="badge grey">${a.category}</span>
        <div class="hint" style="margin-top:4px;">${escapeHtml(a.answer)}</div>
        ${canManage ? `<button class="btn btn-sm btn-outline" style="margin-top:6px;" onclick="if(confirm('Remove this article?')) withRequest('faq-del-${a.id}', ()=>deleteFaqArticle('${a.id}'))">Remove</button>` : ""}
      </div>`).join("") || `<div class="empty">No FAQ articles yet.</div>`}
    </div>
    ${canManage ? `<div class="card" style="max-width:640px;">
      <div class="card-title">Add FAQ Article</div>
      <form onsubmit="return submitNewFaq(event)">
        <div class="form-grid">
          <div class="field"><label>Category</label><select name="category">${["General","Technical","Billing","Feature Request","Bug Report","Account"].map(c=>`<option>${c}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label>Question</label><input name="question" required></div>
        <div class="field"><label>Answer</label><textarea name="answer" rows="3" required></textarea></div>
        <button class="btn btn-primary btn-sm" type="submit">Add Article</button>
      </form>
    </div>` : ""}
  `;
}
function submitNewFaq(ev){
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  return withRequest('add-faq', async ()=>{
    await api.post('/api/faq', f);
    toast("FAQ article added");
    await loadFaq(DB.faqArticles?DB.faqArticles.filters:{});
  });
}
async function deleteFaqArticle(id){
  await api.del(`/api/faq/${id}`);
  toast("FAQ article removed");
  await loadFaq(DB.faqArticles?DB.faqArticles.filters:{});
}

function renderAccount(){

    "Loan Officer": ["View Details","My Work Plan","Leave & Attendance","Salary Advance","Update Details","Security & Login"],
    "Manager": ["View Details","Branch Responsibilities","My Targets & Performance","Leave & Attendance","Salary Advance","Update Details","Security & Login"],

    "Admin": ["View Details","System Responsibilities","System Administration","M-Pesa Configuration","Governance Responsibilities","Leave & Attendance","Salary Advance","Update Details","Security & Login"],
    "CEO": ["View Details","Executive Responsibilities","System Administration","Leave & Attendance","Salary Advance","Update Details","Security & Login"],
    "Director": ["View Details","Governance Responsibilities","System Administration","Leave & Attendance","Salary Advance","Update Details","Security & Login"],
  };
  const tabs = roleTabs[session.role] || roleTabs["Loan Officer"];
  const active = tabs.includes(session.subtab) ? session.subtab : "View Details";
  const tabsHtml = `<div class="subtabs">${tabs.map(t=>`<div class="subtab ${active===t?'active':''}" onclick="goTo('account','${t}')">${t}</div>`).join("")}</div>`;

  let body;
  if(active==="My Work Plan") body = renderMyWorkPlan();
  else if(active==="Branch Responsibilities") body = renderBranchResponsibilities();
  else if(active==="Regional Responsibilities") body = renderRegionalResponsibilities();
  else if(active==="Operational Responsibilities") body = renderOperationalResponsibilities();
  else if(active==="Financial Responsibilities") body = renderFinancialResponsibilities();
  else if(active==="System Responsibilities") body = renderSystemResponsibilities();
  else if(active==="Executive Responsibilities") body = renderExecutiveResponsibilities();
  else if(active==="Governance Responsibilities") body = renderGovernanceResponsibilities();
  else if(active==="M-Pesa Configuration") body = renderMpesaConfiguration();
  else if(active==="System Administration") body = renderSystemAdministration();
  else if(active==="My Targets & Performance") body = renderMyTargetsPerformance();
  else if(active==="Leave & Attendance") body = renderLeaveAttendance();
  else if(active==="Salary Advance") body = renderSalaryAdvanceTab();
  else if(active==="Update Details") body = renderUpdateDetails();
  else if(active==="Security & Login") body = renderSecurityLogin();
  else body = renderViewDetails();
  return tabsHtml + body;
}

async function createSystemBackup(){
  const result = await api.post('/api/system/backup', {});
  // Real download of the actual snapshot data — not a fake "backup
  // complete" toast with nothing behind it. Wrapped separately: if the
  // browser blocks the download for some reason, that must never prevent
  // the real backup (already created server-side above) from showing up
  // in the real history below.
  try {
    const blob = new Blob([result.snapshot], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `rhinocash-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e){ console.error('Backup download failed', e); }
  toast("Backup created");
  await loadSystemAdminData();
}

// ---- Client photo / ID photo viewer: real zoom (in/out), rotate (90°
// steps — one step turns it sideways, two turns it upside down), replace
// (a real camera-triggered upload that deletes the old document for that
// slot so it doesn't leave a duplicate behind) and delete — all against
// the real client_documents record for that photo slot (Client Photo /
// ID Photo Front / ID Photo Back), pure client-side CSS transforms for
// zoom/rotate, no server round-trip needed for those two.
function openImageViewer(clientId, docType, title){
  const doc = DB.documents.find(d=>d.clientId===clientId && d.type===docType);
  DB.imageViewer = { clientId, docType, title: title||'Image', docId: doc?doc.id:null, url: doc&&doc.filePath?`${API_BASE}${doc.filePath}`:null, scale:1, rotation:0 };
  openModal('image-viewer');
}
function zoomImageViewer(delta){
  const iv = DB.imageViewer; if(!iv) return;
  iv.scale = Math.max(0.25, Math.min(4, +(iv.scale+delta).toFixed(2)));
  renderApp();
}
function rotateImageViewer(deg){
  const iv = DB.imageViewer; if(!iv) return;
  iv.rotation = (iv.rotation + deg + 360) % 360;
  renderApp();
}
function triggerImageViewerFilePicker(){
  const el = document.getElementById('image-viewer-file-input');
  if(el) el.click();
}
function handleImageViewerFileChange(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const iv = DB.imageViewer;
  if(!iv) return;
  return withRequest('image-viewer-upload', async ()=>{
    const uploaded = await uploadFile(file);
    const oldDocId = iv.docId;
    const newDoc = await addDocument(iv.clientId, file.name, iv.docType, uploaded.path);
    if(oldDocId) await deleteClientDocument(iv.clientId, oldDocId);
    DB.imageViewer = { ...iv, docId:newDoc.id, url:`${API_BASE}${newDoc.filePath}`, scale:1, rotation:0 };
    toast("Photo updated");
  });
}
function deleteImageViewerPhoto(){
  const iv = DB.imageViewer;
  if(!iv || !iv.docId){ toast("No photo to delete"); return; }
  if(!confirm(`Delete this ${iv.title}?`)) return;
  return withRequest('image-viewer-delete', async ()=>{
    await deleteClientDocument(iv.clientId, iv.docId);
    DB.imageViewer = { ...iv, docId:null, url:null, scale:1, rotation:0 };
    toast("Photo deleted");
  });
}
function renderImageViewerModal(){
  const iv = DB.imageViewer;
  if(!iv) return `<div class="empty">No image selected.</div>`;
  return `
    <div class="modal-head"><h3>${escapeHtml(iv.title)}</h3><span class="btn btn-outline btn-sm" onclick="closeModal()">✕</span></div>
    <div style="display:flex; align-items:center; justify-content:center; overflow:auto; min-height:280px; max-height:50vh; background:#F5F4F1; border-radius:10px; padding:16px;">
      ${iv.url
        ? `<img src="${iv.url}" alt="${escapeHtml(iv.title)}" style="max-width:none; max-height:40vh; transition:transform 0.15s ease; transform:scale(${iv.scale}) rotate(${iv.rotation}deg);">`
        : `<div style="width:140px; height:140px; border-radius:50%; background:#E4E1DA; display:flex; align-items:center; justify-content:center; font-size:64px; transform:scale(${iv.scale}) rotate(${iv.rotation}deg);">👤</div>`}

        <div class="field"><label>Start Date</label><input name="start_date" type="date" required></div>
        <div class="field"><label>End Date</label><input name="end_date" type="date" required></div>
      </div>

      <div class="card-title" style="margin-top:18px;">Your Recent Leave Requests</div>
      <div class="table-wrap"><table><tr><th>Type</th><th>Dates</th><th>Status</th></tr>
      ${mine.slice(0,5).map(l=>`<tr><td>${l.leave_type}</td><td>${l.start_date} → ${l.end_date}</td><td>${statusBadge(l.status)}</td></tr>`).join("")}</table></div>
    ` : ""}
  `;
}
function submitApplyLeave(ev){
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  if(new Date(f.end_date) < new Date(f.start_date)){ toast("End date cannot be before the start date"); return false; }
  const days = Math.round((new Date(f.end_date) - new Date(f.start_date))/86400000) + 1;
  if(days <= 0){ toast("Leave duration must be at least 1 day"); return false; }
  return withRequest('apply-leave', async ()=>{
    const res = await api.post('/api/leave-requests', f);
    DB.leaveRequests.unshift(res.leaveRequest);
    toast("Leave application submitted — awaiting your reporting manager's decision");
    closeModal();
  });
}

    opts.push({ value: d.toISOString().slice(0,7), label: d.toLocaleString('en-KE',{month:'short', year:'numeric'}) });

// ==================== Payments (M-Pesa/Paybill) — real, broader-visibility browser over /api/mpesa/c2b/transactions (topbar cash icon) ====================
const C2B_PERIOD_OPTIONS = [
  { value:'today', label:'Today' },
  { value:'week', label:'This Week' },
  { value:'month', label:'This Month' },
  { value:'all', label:'All Time' },
];
function c2bPeriodRange(period){
  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);
  if(period==='today') return { from: todayStr, to: todayStr };
  if(period==='week'){ const d = new Date(now); d.setDate(d.getDate()-6); return { from: d.toISOString().slice(0,10), to: todayStr }; }
  if(period==='month'){ const d = new Date(now.getFullYear(), now.getMonth(), 1); return { from: d.toISOString().slice(0,10), to: todayStr }; }
  return { from:'', to:'' }; // all time
}
let c2bPaymentsReqSeq = 0;
async function loadC2bPaymentsBrowser(){
  const st = session.c2bPaymentsState;
  const seq = ++c2bPaymentsReqSeq;
  return withRequest('load-c2b-payments:'+JSON.stringify(st), async ()=>{
    const { from, to } = c2bPeriodRange(st.period);
    const params = new URLSearchParams({ page: st.page||1, limit: 20 });
    if(from) params.set('from', from);
    if(to) params.set('to', to);
    if(st.q) params.set('q', st.q);
    const result = await api.get('/api/mpesa/c2b/transactions?'+params.toString());
    if(seq !== c2bPaymentsReqSeq) return; // a newer request has since superseded this one
    result.stateKey = JSON.stringify(st);
    DB.c2bPaymentsBrowser = result;
    DB.c2bUnmatchedCount = result.totals.unmatchedCount;
  });
}
function openC2bPaymentsPanel(){
  if(!session.c2bPaymentsState) session.c2bPaymentsState = { period:'today', q:'', page:1 };
  openModal('c2b-payments');
}
function assignC2bPayment(id, loanId){
  if(!loanId) { toast("Select a loan first"); return; }
  return withRequest('assign-c2b-'+id, async ()=>{
    await api.post(`/api/mpesa/c2b/${id}/match`, { loan_id: loanId });
    toast("Payment assigned and posted");
    DB.c2bPaymentsBrowser = null;
    await loadC2bPaymentsBrowser();
  });
}
function renderC2bPaymentsModal(){
  const st = session.c2bPaymentsState;
  if(!DB.c2bPaymentsBrowser || DB.c2bPaymentsBrowser.stateKey !== JSON.stringify(st)){
    loadC2bPaymentsBrowser();
    return `<div class="modal-head"><h3>Payments</h3><span class="btn btn-outline btn-sm" onclick="closeModal()">✕</span></div><div class="empty">Loading…</div>`;
  }
  const d = DB.c2bPaymentsBrowser;
  const { page, totalPages, total } = d.pagination;
  const canAssign = hasPermission(session.role,"Post Accounting Entries") || session.role==='Manager';
  return `
    <div class="modal-head"><h3>Payments (${fmt(d.totals.amount)})</h3><span class="btn btn-outline btn-sm" onclick="closeModal()">✕</span></div>
    <div class="pill-row" style="margin-bottom:10px; flex-wrap:wrap;">
      <select onchange="session.c2bPaymentsState.period=this.value; session.c2bPaymentsState.page=1; DB.c2bPaymentsBrowser=null; renderApp();">
        ${C2B_PERIOD_OPTIONS.map(p=>`<option value="${p.value}" ${p.value===st.period?'selected':''}>${p.label}</option>`).join("")}
      </select>
      <input placeholder="🔍 Search payment" value="${escapeHtml(st.q)}" oninput="session.c2bPaymentsState.q=this.value; session.c2bPaymentsState.page=1; DB.c2bPaymentsBrowser=null; renderApp();">
    </div>
    <div class="table-wrap" style="max-height:420px; overflow-y:auto;"><table>
      <tr><th>Client</th><th>Phone</th><th>Paybill</th><th>Account</th><th>Transaction</th><th>Amount</th><th>Date</th>${canAssign?'<th></th>':''}</tr>
      ${d.transactions.map(t=>`<tr>
        <td>${t.matched ? escapeHtml(t.clientName||'—') : `<span class="badge red">Unassigned</span>`}</td>
        <td>${escapeHtml(t.phone||'—')}</td>
        <td>${escapeHtml(d.shortcode||'—')}</td>
        <td class="hint">${escapeHtml(t.accountRef||'—')}</td>
        <td>${escapeHtml(t.transId)}</td>
        <td>${fmt(t.amount)}</td>
        <td>${new Date(t.createdAt).toLocaleDateString()}</td>
        ${canAssign ? (t.matched ? '<td></td>' : `<td><select id="c2b-assign-${t.id}"><option value="">Assign to loan…</option>${activeLoans().map(l=>`<option value="${l.id}">${l.id} — ${clientName(l.clientId)}</option>`).join("")}</select>
          <button class="btn btn-sm btn-primary" onclick="assignC2bPayment('${t.id}', document.getElementById('c2b-assign-${t.id}').value)">Assign</button></td>`) : ''}
      </tr>`).join("") || `<tr><td colspan="${canAssign?8:7}" class="empty">No payments match the selected filters.</td></tr>`}
    </table></div>
    ${total>d.pagination.limit ? `<div class="pill-row" style="margin-top:10px;"><button class="btn btn-sm btn-outline" ${page<=1?'disabled':''} onclick="session.c2bPaymentsState.page=${page-1}; DB.c2bPaymentsBrowser=null; renderApp();">← Prev</button><span>Page ${page} of ${totalPages} (${total})</span><button class="btn btn-sm btn-outline" ${page>=totalPages?'disabled':''} onclick="session.c2bPaymentsState.page=${page+1}; DB.c2bPaymentsBrowser=null; renderApp();">Next →</button></div>` : ""}
  `;
}

/* ---------------- Init ---------------- */
renderApp(); // shows the login screen immediately; real data loads only after a real login
</script>
</body>
</html>
