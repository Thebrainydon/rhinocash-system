<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rhinocash — Microfinance Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --navy:#1F3864; --navy-deep:#152647; --navy-soft:#2E4A7D;
  --rust:#B5651D; --rust-soft:#D98B4A; --claude:#D97757;
  --bg:#F5F4F1; --card:#FFFFFF; --line:#E4E1DA;
  --ink:#1C1C1E; --ink-soft:#5B5952; --ink-faint:#8B897F;
  --green:#2F7D5C; --green-bg:#E7F3EC;
  --amber:#B4791F; --amber-bg:#FBF0DD;
  --red:#B3261E; --red-bg:#FAEAE9;
  --blue:#2E5C8A; --blue-bg:#E9F0F8;
  --purple:#7A4FB5; --purple-bg:#F0E9FA;
  font-size:15px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}
.app{display:flex; min-height:100vh;}

/* ---- Sidebar ---- */
.sidebar{
  width:264px; background:linear-gradient(180deg, var(--navy) 0%, var(--green) 100%); color:#EDEFF4; flex-shrink:0;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:space-between;}
.brand-mark{font-weight:800; font-size:20px; letter-spacing:0.5px; color:#fff;}
.brand-mark span{color:var(--rust-soft);}
.brand-sub{font-size:11px; color:#9FB0CC; margin-top:2px; letter-spacing:0.3px;}
.sidebar-close{display:none; color:#FDEEE7; font-size:20px; cursor:pointer; line-height:1;}
.side-profile{
  padding:18px 18px 16px; background:linear-gradient(135deg,#E0895F,var(--claude) 75%);
  border-bottom:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:space-between;
}
.side-profile-logo{ background:#fff; border-radius:9px; padding:8px 10px; margin-bottom:12px; display:inline-block; }
.side-profile-logo img{ width:120px; height:auto; display:block; }
.side-profile-name{ font-weight:800; font-size:15.5px; color:#fff; }
.side-profile-role{ font-size:11.5px; color:#FDEEE7; margin-top:1px; }
.side-profile-status{ display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; color:#FDEEE7; }
.side-online-dot{ width:8px; height:8px; border-radius:50%; background:#33D17A; box-shadow:0 0 6px #33D17A; flex-shrink:0; }
.nav{padding:10px 10px 20px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
  color:#C7D1E3; font-size:13.5px; cursor:pointer; margin-bottom:2px; user-select:none;
  transition:background .12s;
}
.nav-item:hover{background:rgba(255,255,255,0.06);}
.nav-item.active{background:var(--rust); color:#fff; font-weight:600;}
.nav-num{
  width:20px; height:20px; border-radius:5px; background:rgba(255,255,255,0.08);
  display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; flex-shrink:0;
}
.nav-item.active .nav-num{background:rgba(255,255,255,0.25);}
.side-section{ margin-bottom:2px; }
.side-section-head{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
  color:#DCE2F0; font-size:13.5px; font-weight:600; cursor:pointer; user-select:none; transition:background .12s;
}
.side-section-head:hover{ background:rgba(255,255,255,0.06); }
.side-section-icon{ font-size:14px; width:18px; text-align:center; flex-shrink:0; }
.side-section-label{ flex:1; }
.side-chevron{ font-size:10px; color:#8C97B8; transition:transform .15s; }
.side-section.open .side-chevron{ transform:rotate(180deg); }
.side-subitems{ max-height:0; overflow:hidden; transition:max-height .18s ease; padding-left:8px; }
.side-section.open .side-subitems{ max-height:900px; }
.side-subitem{
  display:block; padding:7px 12px 7px 34px; font-size:12.5px; color:#AEB8D4; cursor:pointer; border-radius:6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.side-subitem:hover{ background:rgba(255,255,255,0.06); color:#fff; }
.side-subitem.active{ background:rgba(181,101,29,0.35); color:#fff; font-weight:600; }
.sidebar-foot{padding:14px 20px; border-top:1px solid rgba(255,255,255,0.08); font-size:11px; color:#D7ECE1;}
.sidebar-backdrop{display:none;}
.hamburger{
  display:none; align-items:center; justify-content:center; width:36px; height:36px; border-radius:8px;
  border:1px solid var(--line); background:#fff; cursor:pointer; font-size:17px; flex-shrink:0; color:var(--navy);
}

/* ---- Topbar ---- */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  background:var(--card); border-bottom:1px solid var(--line); padding:14px 18px;
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; gap:10px;
}
.topbar-left{display:flex; align-items:center; gap:10px; min-width:0;}
.topbar-brand{font-weight:800; font-size:15px; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.role-select{
  border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 10px; font-size:12.5px;
  color:var(--ink); font-weight:600; cursor:pointer;
}
.avatar{
  width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; display:flex;
  align-items:center; justify-content:center; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0;
}
.bell{position:relative; cursor:pointer; font-size:18px; color:var(--ink-soft);}
.bell-dot{position:absolute; top:-3px; right:-4px; background:var(--rust); color:#fff; font-size:9px; font-weight:800; border-radius:8px; padding:1px 4px; min-width:14px; text-align:center;}
.content{padding:24px 26px 60px; flex:1;}

/* ---- Cards / KPIs ---- */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:20px;}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
.kpi-label{font-size:11.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:0.4px;}
.kpi-value{font-size:24px; font-weight:800; color:var(--navy); margin-top:6px;}
.kpi-delta{font-size:11.5px; margin-top:5px; font-weight:600;}
.kpi-delta.up{color:var(--green);} .kpi-delta.down{color:var(--red);}

.grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr;}}
/* Dashboard KPI tiles (kpiTiles()): always 2 columns, even on narrow phone
   widths — unlike .grid2/.grid3 above, which intentionally collapse to a
   single column for content (like paired charts) that needs full width to
   stay readable on mobile. These tiles are short summary numbers meant to
   be scanned two-up, matching the existing dashboard layout convention. */
.kpi-tile-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.profile-info-row{padding:7px 0; border-bottom:1px solid var(--line);}

.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:16px;}
.card-title{font-size:14.5px; font-weight:800; color:var(--navy); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
.card-title small{font-size:11.5px; font-weight:600; color:var(--ink-faint);}

/* bar chart (hand-rolled) */
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
.bar-label{width:120px; flex-shrink:0; color:var(--ink-soft); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{flex:1; background:#EFEDE7; border-radius:5px; height:16px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--navy),var(--navy-soft)); border-radius:5px;}
.bar-fill.rust{background:linear-gradient(90deg,var(--rust),var(--rust-soft));}
.bar-val{width:74px; text-align:right; font-weight:700; color:var(--navy); flex-shrink:0;}

/* ---- Tables ---- */
table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.3px; color:var(--ink-faint);
  padding:9px 10px; border-bottom:2px solid var(--line); font-weight:700;
}
td{padding:10px 10px; border-bottom:1px solid var(--line); color:var(--ink);}
tr:last-child td{border-bottom:none;}
tr.clickable:hover{background:#FAFAF8; cursor:pointer;}
.table-wrap{overflow-x:auto;}

/* ---- Badges ---- */
.badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700;}
.badge.green{background:var(--green-bg); color:var(--green);}
.badge.amber{background:var(--amber-bg); color:var(--amber);}
.badge.red{background:var(--red-bg); color:var(--red);}
.badge.blue{background:var(--blue-bg); color:var(--blue);}
.badge.purple{background:var(--purple-bg); color:var(--purple);}
.badge.grey{background:#EFEDE7; color:var(--ink-soft);}

/* ---- Buttons ---- */
.btn{
  border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:opacity .1s;
}
.btn:hover{opacity:0.88;}
.btn-primary{background:var(--navy); color:#fff;}
.btn-rust{background:var(--rust); color:#fff;}
.btn-outline{background:#fff; border:1px solid var(--line); color:var(--ink);}
.btn-green{background:var(--green); color:#fff;}
.btn-red{background:var(--red); color:#fff;}
.btn-sm{padding:5px 11px; font-size:12px;}
.btn:disabled{opacity:0.4; cursor:not-allowed;}
.page-back-btn{border-radius:50%; width:34px; height:34px; padding:0; justify-content:center; flex-shrink:0;}

/* ---- Tabs ---- */
.subtabs{display:flex; gap:4px; margin-bottom:18px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:0;}
.subtab{
  padding:9px 14px; font-size:13px; font-weight:600; color:var(--ink-faint); cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.subtab.active{color:var(--navy); border-bottom:2px solid var(--rust);}

/* ---- Forms ---- */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12px; font-weight:700; color:var(--ink-soft);}
.field input, .field select, .field textarea{
  border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:13.5px; font-family:inherit;
  background:#fff; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--navy-soft); outline-offset:1px;}
.hint{font-size:11px; color:var(--ink-faint);}

/* ---- Misc ---- */
.empty{padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13px;}
.pill-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.search{border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13px; width:240px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.detail-label{font-size:11px; color:var(--ink-faint); text-transform:uppercase; font-weight:700; letter-spacing:0.3px;}
.detail-value{font-size:14px; color:var(--ink); font-weight:600; margin-top:2px; margin-bottom:12px;}
.modal-overlay{position:fixed; inset:0; background:rgba(15,20,30,0.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; z-index:50; overflow-y:auto;}
.modal{background:#fff; border-radius:14px; padding:24px 26px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-wide{max-width:960px;}
.count-badge{background:var(--rust); color:#fff; font-size:10.5px; font-weight:800; border-radius:9px; padding:2px 7px; flex-shrink:0;}
.notif-card{border-radius:8px; overflow:hidden; margin-bottom:10px;}
.notif-card-head{background:var(--blue-bg); color:var(--navy); padding:9px 14px; font-weight:700; font-size:12.5px;}
.notif-card-body{background:var(--bg-soft,#F4F4F4); padding:10px 14px; font-size:13px; color:var(--ink);}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-head h3{color:var(--navy); font-size:17px;}
.close-x{cursor:pointer; font-size:20px; color:var(--ink-faint); line-height:1;}
.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:100; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--navy); color:#fff; padding:11px 18px; border-radius:9px; font-size:13px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,0.2); animation:slidein .15s ease-out;}
@keyframes slidein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.notif-item{padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:flex-start;}
.notif-item:last-child{border-bottom:none;}
.notif-dot{width:8px; height:8px; border-radius:50%; background:var(--rust); margin-top:5px; flex-shrink:0;}
.notif-dot.read{background:var(--line);}
.section-note{background:var(--blue-bg); color:var(--navy); border-radius:9px; padding:11px 14px; font-size:12.5px; margin-bottom:16px;}
.loading-screen{display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; gap:10px; color:var(--ink-faint); font-size:14px;}

/* ---- Login screen ---- */
.login-screen{
  --lime:#B8E62E; --lime-dark:#8FBF23;
  min-height:100vh; background:linear-gradient(160deg,#150F30 0%,#241A4D 55%,#1A1140 100%);
  display:flex; align-items:center; justify-content:center; padding:36px 18px;
}
.login-wrap{width:100%; max-width:400px;}
.login-logo-card{
  background:rgba(0,0,0,0.25); border:1px solid rgba(184,230,46,0.2); border-radius:14px; padding:18px 20px 14px; text-align:center; margin-bottom:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
}
.login-logo-img{width:100%; max-width:230px; height:auto; display:block; margin:0 auto;}
.login-logo-mark{font-size:26px; font-weight:800; color:var(--navy); letter-spacing:0.3px;}
.login-logo-mark span{color:var(--rust);}
.login-logo-tag{margin-top:2px; font-size:12.5px; color:#B9B4D6; border-top:2px solid var(--lime); padding-top:8px; display:inline-block;}
.login-panel{
  background:rgba(255,255,255,0.05); border:1px solid rgba(184,230,46,0.18); border-radius:14px; padding:26px 24px;
  backdrop-filter:blur(2px);
}
.login-title{color:var(--lime); font-size:21px; font-weight:800; text-align:center; margin-bottom:20px;}
.login-field{margin-bottom:16px;}
.login-field-row{display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(184,230,46,0.35); border-radius:9px; padding:11px 14px;}
.login-field-row.focus-ring{border-color:var(--lime);}
.login-field-row svg{flex-shrink:0; opacity:0.85;}
.login-field-row input{
  background:transparent; border:none; outline:none; color:#fff; font-size:14px; width:100%;
}
.login-field-row input::placeholder{color:#A9A3C9;}
.login-btn{
  width:100%; background:linear-gradient(180deg,var(--lime),var(--lime-dark)); color:#152300; border:none; border-radius:9px;
  padding:13px; font-size:15px; font-weight:800; cursor:pointer; margin-top:6px; letter-spacing:0.2px;
}
.login-btn:hover{opacity:0.92;}
.login-btn-spinner{display:inline-block; width:15px; height:15px; vertical-align:-3px; margin-right:7px; animation:loginSpin 0.8s linear infinite;}
@keyframes loginSpin{ to{ transform:rotate(360deg); } }
.login-forgot{text-align:right; margin-top:12px;}
.login-forgot a{color:var(--lime); font-size:12.5px; text-decoration:none; cursor:pointer;}
.login-demo-box{margin-top:18px; background:rgba(255,255,255,0.06); border:1px dashed rgba(184,230,46,0.3); border-radius:10px; padding:12px 14px;}
.login-demo-box div.hd{color:#B9B4D6; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; font-weight:700; margin-bottom:8px;}
.demo-user-chip{
  display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1); border:1px solid rgba(184,230,46,0.25);
  color:#fff; border-radius:20px; padding:5px 12px; font-size:11.5px; cursor:pointer; margin:0 6px 6px 0;
}
.demo-user-chip:hover{background:rgba(255,255,255,0.18);}
.login-footer{text-align:center; color:#8C86AD; font-size:11.5px; margin-top:22px; border-top:1px solid rgba(184,230,46,0.15); padding-top:14px;}
.login-error{background:rgba(179,38,30,0.25); border:1px solid rgba(179,38,30,0.5); color:#FFD9D6; font-size:12.5px; padding:9px 12px; border-radius:8px; margin-bottom:14px;}
.login-recovery-text{color:#C9C4E3; font-size:13px; text-align:center; margin-bottom:20px; line-height:1.5;}
.login-back{text-align:center; margin-top:14px;}
.login-back a{color:var(--lime); font-size:12.5px; text-decoration:none; cursor:pointer;}
.login-recovery-success{background:rgba(184,230,46,0.15); border:1px solid rgba(184,230,46,0.4); color:#DFF6A8; font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; text-align:center;}

/* ---- Responsive / mobile ---- */
@media (max-width: 880px){
  .sidebar{
    position:fixed; left:0; top:0; z-index:60; height:100vh;
    transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 40px rgba(0,0,0,0.35);
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-close{ display:block; }
  .sidebar-backdrop.open{
    display:block; position:fixed; inset:0; background:rgba(10,14,24,0.5); z-index:55;
  }
  .hamburger{ display:inline-flex; }
  .topbar{ padding:12px 14px; }
  .topbar-right .role-select{ display:none; }
  .content{ padding:16px 14px 50px; }
  .kpi-grid{ grid-template-columns:repeat(2,1fr); gap:10px; }
  .grid2, .grid3{ grid-template-columns:1fr; }
  .form-grid{ grid-template-columns:1fr; }
  table{ font-size:12px; }
  th, td{ padding:8px 6px; }
}
@media (max-width: 420px){
  .kpi-grid{ grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>
<div id="root"><div class="loading-screen">Loading Rhinocash…</div></div>

<script>
/* =========================================================================
   RHINOCASH — Microfinance Management System
   Single-file client app. Talks to the real Rhinocash backend API over
   HTTPS/HTTP (see API_BASE below) — no business data is stored client-side
   between sessions; the backend database is the single source of truth.

function timeAgo(iso){
  const sec = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/1000));
  if(sec<10) return "just now";
  if(sec<60) return sec+"s ago";
  if(sec<3600) return Math.floor(sec/60)+"m ago";
  if(sec<86400) return Math.floor(sec/3600)+"h ago";
  return Math.floor(sec/86400)+"d ago";
}

/* Modules a user's access can be scoped to. Each maps to a real nav section

const MODULE_LIST = [

  {key:"payments", label:"Payments"}, {key:"accounting", label:"Accounting"}, {key:"reports", label:"Reports"},

];
function hasPermission(role, perm){
  // Personal, per-user overrides (set via Admin's Access & Permissions screen) win first.
  const me = DB && DB.staff && DB.staff.find(s=>s.name===session.userName);
  if(me && me.actionOverrides && perm in me.actionOverrides) return !!me.actionOverrides[perm];
  if(DB && DB.permissionsMatrix && DB.permissionsMatrix[role] && perm in DB.permissionsMatrix[role]) return !!DB.permissionsMatrix[role][perm];
  return !!(DEFAULT_PERMISSIONS_MATRIX[role] && DEFAULT_PERMISSIONS_MATRIX[role][perm]);
}
const CAN_APPROVE_LOANS = r => hasPermission(r, "Approve Loans");
const CAN_POST_ACCOUNTING = r => hasPermission(r, "Post Accounting Entries");

const CAN_OPEN_BRANCH = r => hasPermission(r, "Open New Branch");

/* Real, enforced module-level access check — this is the chokepoint every
   navigation goes through (see goTo()), not just a hidden sidebar button.
   A user's personal moduleAccess list (if the Admin has set one) further
   restricts their role's baseline; investors have no staff record so are
   governed purely by role. */
function isSectionAllowed(section){
  if(section==="placeholder") return true;
  const base = NAV_PERMISSIONS[session.role] || [];
  if(!base.includes(section)) return false;
  if(session.role==="Investor") return true;
  // "notifications" is deliberately not a real backend module (see
  // seed.js's `modules` list and misc.js's /api/notifications route, which
  // has no requireModule gate at all) — every authenticated user can see
  // their own notifications regardless of any per-user module restriction
  // an Admin has set. Real bug, found by an actual sidebar click-through
  // test: without this, any user with a custom finalAccess.modules list
  // (which never includes "notifications", since it isn't one of the 12
  // real modules to begin with) got "Access denied" trying to view it.
  if(section==="notifications") return true;
  // DB.me is the real, server-computed user record (GET /api/auth/me),
  // including finalAccess.modules — the actual effective module list
  // after any per-user Admin-set restriction. This is a UI hint only;
  // the backend enforces the real boundary on every request regardless.
  const modules = DB && DB.me && DB.me.finalAccess && DB.me.finalAccess.modules;
  if(modules && modules.length) return modules.includes(section);

// Real CSV export utility — used by every LoanBook "Export CSV" button.
// Builds a genuine CSV from the real rows already fetched from the
// backend (never fabricated data), escaping values that contain a
// comma, quote, or newline per standard CSV rules, and triggers a real
// browser download via a Blob + temporary anchor element.
function exportRowsToCsv(filename, columns, rows){
  const esc = (v) => {
    if(v===null || v===undefined) return '';
    const s = String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const lines = [columns.join(',')];
  (rows||[]).forEach(r => { lines.push(columns.map(c=>esc(r[c])).join(',')); });
  const csv = lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`Exported ${(rows||[]).length} row(s) to ${filename}`);
}

/* ---------------- Real backend API client ---------------- */
// Configurable at runtime (e.g. by a hosting page setting
// window.RHINOCASH_API_BASE before this script loads) — defaults to a
// local backend on the standard port from the backend's own README.
const API_BASE = (typeof window!=='undefined' && window.RHINOCASH_API_BASE) || 'http://localhost:4000';
// The bearer token lives in memory ONLY — never localStorage/sessionStorage
// (both are readable by any injected script; an XSS bug elsewhere in the
// page would hand over the session). The real tradeoff: a hard page
// reload loses the session and requires logging in again. That's the
// deliberate, secure default; see README "Frontend session handling".
let authToken = null;

class ApiError extends Error {
  constructor(status, message, code){ super(message); this.status = status; this.code = code; }
}
async function apiRequest(method, path, body){
  const headers = {'Content-Type':'application/json'};
  if(authToken) headers['Authorization'] = 'Bearer ' + authToken;
  let res;
  try{
    res = await fetch(API_BASE + path, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
  }catch(e){
    throw new ApiError(0, `Can't reach the Rhinocash server at ${API_BASE}. Check your connection, or that the backend is running (see README).`);
  }
  let json = null;
  try{ json = await res.json(); }catch(e){ /* no/invalid body */ }
  if(res.status === 401){
    // Session expired/revoked/invalid — force back to the login screen
    // rather than let the app carry on showing stale, now-inaccessible data.
    if(session.loggedIn){
      authToken = null; session.loggedIn = false; session.section="dashboard";
      DB = null;
      if(sessionWarningTimer){ clearTimeout(sessionWarningTimer); sessionWarningTimer = null; }
      broadcastSessionEnded();
      openModal('session-expired');
    }
    throw new ApiError(401, (json&&json.error) || 'Not authenticated');
  }
  if(!res.ok){
    throw new ApiError(res.status, (json&&json.error) || `Request failed (HTTP ${res.status})`, json&&json.code);
  }
  return json;
}
// Real file upload — the standard apiRequest() always JSON-encodes, which
// is incompatible with /api/uploads' raw-binary contract (Content-Type =
// the file's real MIME type, X-Filename header, raw bytes as the body).
async function uploadFile(file){
  const buf = await file.arrayBuffer();
  const headers = { 'Content-Type': file.type, 'X-Filename': encodeURIComponent(file.name) };
  if(authToken) headers['Authorization'] = 'Bearer ' + authToken;
  let res;
  try{ res = await fetch(API_BASE + '/api/uploads', { method:'POST', headers, body: buf }); }
  catch(e){ throw new ApiError(0, "Can't reach the server to upload this file."); }
  let json = null; try{ json = await res.json(); }catch(e){}
  if(!res.ok) throw new ApiError(res.status, (json&&json.error) || `Upload failed (HTTP ${res.status})`);
  return json; // {path, contentType}
}
const api = {
  get: (path) => apiRequest('GET', path),
  post: (path, body) => apiRequest('POST', path, body),
  put: (path, body) => apiRequest('PUT', path, body),
  patch: (path, body) => apiRequest('PATCH', path, body),
  del: (path) => apiRequest('DELETE', path),
};
// A form/button wraps its real submit logic in this so every mutation
// gets the same handling: no double-submits, a clear error toast instead
// of a silent failure or a stack trace, and the UI never freezes without
// feedback (requirement: loading state + duplicate-submit prevention).
let inFlight = new Set();
async function withRequest(key, fn){
  if(inFlight.has(key)) return; // duplicate-submit guard
  inFlight.add(key);
  try{ await fn(); }
  catch(e){
    if(e instanceof ApiError){
      if(e.status !== 401) toast(e.message); // 401 already handled/toasted by apiRequest
    } else {
      console.error(e);
      toast("Something went wrong. Please try again.");
    }
  }
  finally{ inFlight.delete(key); renderApp(); }
}

/* ---------------- Persistence ---------------- */
// Business data (clients/loans/payments/...) no longer persists to
// browser storage at all — the backend database is the single source of
// truth, per the integration requirements. This app now re-fetches from
// the API on login and after every mutation, same as any normal web app
// talking to a real server. storageOk/lastSavedAt are kept only so the
// (harmless, cosmetic) sidebar footer text still renders sensibly.
let storageOk = true;
let lastSavedAt = null;
function save(){ renderApp(); } // local UI-state changes just re-render; nothing to persist remotely here

/* ---------------- Load real data from the backend ---------------- */
// Called right after a successful login. Pulls everything the current
// role's dashboards/tables need into the same DB.* shape the existing
// (unmodified) rendering code already reads — the data is now 100% real
// and already scoped server-side to what this user may see.
async function loadCoreData(){
  DB = { branches:[], regions:[], products:[], staff:[], clients:[], groups:[], leads:[], loans:[], payments:[],
    transactions:[], expenses:[], interactions:[], documents:[], notifications:[], auditLog:[], supportTickets:[],
    leaveRequests:[], salaryAdvances:[], shareholders:[], investors:[], investorPayouts:[], taxObligations:[], boardMatters:[],
    permissionsMatrix:{}, branchProposals:[], accounts:[], me:null, cashPosition:null, integrationsStatus:null, targets:[], targetEligibleRecipients:[], targetHistory:[], paymentsPages:{}, acctPages:{},
    loanStatusBrowser:null, pendingPaymentsBrowser:null, ticketsBrowser:null, c2bPaymentsBrowser:null, c2bUnmatchedCount:0, requisitionForm:null, utilPaymentForm:null, bulkUploadForm:null, expectedCashflowData:null, leadForm:null, importClientsForm:null };

  const isInvestor = session.role === "Investor";
  const calls = [];
  // These three are staff-only (requireAuth rejects an investor token
  // outright — investors have no role_id at all, by design). Calling them
  // unconditionally for an investor session was a real bug: the resulting
  // 401 tripped this app's own auto-logout interceptor mid-load, silently
  // wiping the investor's just-established session before the rest of
  // this function could finish — which is exactly why the dashboard
  // looked like a login failure even though the backend had genuinely
  // authenticated them seconds earlier.
  if(!isInvestor){
    calls.push(api.get('/api/branches').then(r=>{ DB.branches = r.branches.map(adaptBranch); }).catch(()=>{}));
    calls.push(api.get('/api/regions').then(r=>{ DB.regions = r.regions.map(adaptRegion); }).catch(()=>{}));
    calls.push(api.get('/api/loan-products').then(r=>{ DB.products = r.products.map(adaptProduct); }).catch(()=>{}));
  }

  if(isInvestor){
    // Unlike every other /api/*/me-style endpoint, this one returns the
    // investor object directly (no {investor:...} wrapper) and already in
    // camelCase — a real, deliberate difference from the staff /api/auth/me
    // contract, not something to paper over with a second adapter.
    calls.push(api.get('/api/investor/me').then(r=>{ DB.me = r; }).catch(()=>{}));
    calls.push(api.get('/api/investor/payouts').then(r=>{ DB.investorPayouts = r.payouts.map(adaptInvestorPayout); }).catch(()=>{}));
    calls.push(api.get('/api/investor/company-performance').then(r=>{ DB.investorCompanyPerformance = r; }).catch(()=>{}));
    calls.push(api.get('/api/collections/investor-summary').then(r=>{ DB.investorCollectionsSummary = r; }).catch(()=>{}));
  } else {
    calls.push(api.get('/api/auth/me').then(r=>{ DB.me = r.user; }).catch(()=>{}));
    // Real targets — visible to everyone (Loan Officer sees their own;
    // managers see what they set + their real downward scope). No module
    // gate here deliberately: target visibility isn't a staff-management
    // permission, it's "can you see your own assigned targets," which
    // every role in the hierarchy needs regardless of what else they can access.
    calls.push(api.get('/api/targets').then(r=>{ DB.targets = r.targets.map(adaptTarget); }).catch(()=>{}));
    if(['Manager','Regional Manager','Operational Manager','CEO','Director'].includes(session.role)){
      calls.push(api.get('/api/targets/eligible-recipients').then(r=>{ DB.targetEligibleRecipients = r.users; }).catch(()=>{}));
    }
    if(NAV_PERMISSIONS[session.role]?.includes('clients')) calls.push(api.get('/api/clients').then(r=>{ DB.clients = r.clients.map(adaptClient); }).catch(()=>{}));
    if(NAV_PERMISSIONS[session.role]?.includes('clients')) calls.push(api.get('/api/leads').then(r=>{ DB.leads = r.leads.map(l=>({id:l.id, name:l.name, phone:l.phone, source:l.source, status:l.status, notes:l.notes, createdAt:l.created_at})); }).catch(()=>{}));
    if(NAV_PERMISSIONS[session.role]?.includes('loanbook')) calls.push(api.get('/api/loans').then(r=>{ DB.loans = r.loans.map(adaptLoan); }).catch(()=>{}));
    // Dashboards/computeStats() need the FULL set to compute correct
    // MTD/collection/arrears figures — they must never silently operate on
    // just one page. The dedicated Processed Payments / Payments Report /
    // Prepayments views fetch their own real small pages separately
    // (loadPaymentsPage); this one bulk fetch is deliberately requested at
    // a high limit so existing dashboard math keeps seeing everything.
    if(NAV_PERMISSIONS[session.role]?.includes('payments')) calls.push(api.get('/api/payments?limit=1000').then(r=>{ DB.payments = r.payments.map(adaptPayment); }).catch(()=>{}));
    // Real, server-side scoped (a Manager only ever gets their own branch's
    // staff now — previously this endpoint had no scope at all, meaning
    // any staff-module user could see the entire company's roster).
    // limit=200 keeps this a genuine "load everything within my real
    // scope" bulk fetch for dashboard/name-lookup purposes, distinct from
    // the paginated, filterable Staff Directory page's own smaller pages.
    if(NAV_PERMISSIONS[session.role]?.includes('staff')) calls.push(api.get('/api/users?limit=200').then(r=>{ DB.staff = r.users.map(adaptStaff); }).catch(()=>{}));
    if(NAV_PERMISSIONS[session.role]?.includes('audit')) calls.push(api.get('/api/audit-logs').then(r=>{ DB.auditLog = r.auditLogs.map(adaptAudit); }).catch(()=>{}));
    if(NAV_PERMISSIONS[session.role]?.includes('accounting')){
      calls.push(api.get('/api/expenses').then(r=>{ DB.expenses = r.expenses.map(adaptExpense); }).catch(()=>{}));
      calls.push(api.get('/api/journal-entries').then(r=>{ DB.transactions = r.entries.map(adaptTxn); }).catch(()=>{}));
      calls.push(api.get('/api/accounts').then(r=>{ DB.accounts = r.accounts; }).catch(()=>{}));
      // The one authoritative source for cash-by-account figures — computed
      // server-side with the correct debit/credit sign convention. The
      // dashboard used to re-derive this from raw DB.transactions with the
      // OPPOSITE sign and the wrong (capitalized) account-id casing, which
      // silently produced wrong or always-zero numbers. Fixed by reading
      // the real number instead of re-deriving a second, contradictory one.
      calls.push(api.get('/api/accounting/cash-position').then(r=>{ DB.cashPosition = r.balances; }).catch(()=>{}));
    }
    calls.push(api.get('/api/notifications').then(r=>{ DB.notifications = r.notifications.map(adaptNotification); }).catch(()=>{}));
    // support-tickets are now loaded on-demand (paginated) by the
    // Support Center page itself, not bulk-fetched on every login.
    calls.push(api.get('/api/leave-requests').then(r=>{ DB.leaveRequests = r.leaveRequests; }).catch(()=>{}));
    calls.push(api.get('/api/salary-advances').then(r=>{ DB.salaryAdvances = r.salaryAdvances; }).catch(()=>{}));
    if(hasPermission(session.role,'open_new_branch') || session.role==="Admin" || session.role==="CEO"){
      calls.push(api.get('/api/branch-proposals').then(r=>{ DB.branchProposals = r.proposals.map(adaptBranchProposal); }).catch(()=>{}));
    }
    if(session.role==="Director" || session.role==="CEO" || session.role==="Admin"){
      calls.push(api.get('/api/investors').then(r=>{ DB.investors = (r.investors||[]).map(i=>({id:i.id, name:i.name, amount:i.amount, profitSharePct:i.profit_share_pct, termMonths:i.term_months, startDate:i.start_date, status:i.status})); }).catch(()=>{}));
    }
    if(session.role==="Admin"){
      // Real integration status (M-Pesa/SMS/Email) — was previously
      // hardcoded "grey / Not connected — demo only" on the dashboard
      // regardless of actual configuration, even though this real
      // status endpoint already existed for the M-Pesa Admin Config work.
      calls.push(api.get('/api/integrations/status').then(r=>{ DB.integrationsStatus = r; }).catch(()=>{}));
    }
    if(NAV_PERMISSIONS[session.role]?.includes('payments') || NAV_PERMISSIONS[session.role]?.includes('accounting')){
      // Loaded up front purely so the topbar's unmatched-payment badge is
      // accurate the moment the app loads, same reason DB.notifications is.
      calls.push(api.get('/api/mpesa/c2b/transactions?limit=1').then(r=>{ DB.c2bUnmatchedCount = r.totals.unmatchedCount; }).catch(()=>{}));
    }
  }
  await Promise.all(calls);
}

  try{ const r = await api.get('/api/notifications'); DB.notifications = r.notifications.map(adaptNotification); }catch(e){}
}

/* ---------------- Derived calculations ---------------- */
// A loan is genuinely "undisbursed" for as long as it hasn't reached a
// real terminal or disbursed state — every status from the moment it's
// submitted through the whole real approval chain, including Returned
// for Correction and a real B2C request still in flight, counts. Shared
// by the Dashboard's own "Undisbursed Loans" KPI and the LoanBook
// Undisbursed Loans page so both always agree on the same real set.
const LOAN_TERMINAL_STATUSES = ['Active','Disbursed','Completed','Rejected','Written Off','Cancelled'];
function isUndisbursedLoan(loan){ return !LOAN_TERMINAL_STATUSES.includes(loan.status); }
// Real outstanding balance = unpaid principal+interest PLUS any real,
// genuinely accrued-but-unpaid penalty (penaltyDue/penaltyPaid — real
// loan_schedule columns, only ever nonzero when the loan's product has a
// real penalty_pct and this installment genuinely is overdue). A loan
// with an unpaid penalty is not actually fully settled, so every reader
// of this single function — KPIs, the Loan History table, the wallet,
// statements — sees that correctly, rather than a handful of call sites
// each remembering to add penalty back in themselves.
function loanBalance(loan){
  if(!loan.schedule || !loan.schedule.length) return (loan.status||"").startsWith("Waiting for") ? 0 : loan.principal;
  return loan.schedule.reduce((s,r)=> s + Math.max(0, r.totalDue - (r.paidAmount||0)) + Math.max(0, (r.penaltyDue||0) - (r.penaltyPaid||0)), 0);
}
function loanOutstandingPrincipal(loan){
  if(!loan.schedule || !loan.schedule.length) return 0;
  return loan.schedule.reduce((s,r)=>{
    const paidRatio = r.totalDue>0 ? Math.min(1,(r.paidAmount||0)/r.totalDue) : 0;
    return s + r.principalDue*(1-paidRatio);
  },0);
}
function isOverdue(row){ return row.status!=="Paid" && new Date(row.dueDate) < new Date(); }
function loanArrearsDays(loan){
  const overdueRows = (loan.schedule||[]).filter(isOverdue);
  if(!overdueRows.length) return 0;
  const oldest = overdueRows.reduce((a,b)=> new Date(a.dueDate)<new Date(b.dueDate)?a:b);
  return Math.max(0, daysBetween(oldest.dueDate, todayISO()));
}
function loanArrearsAmount(loan){
  return (loan.schedule||[]).filter(isOverdue).reduce((s,r)=> s + Math.max(0, r.totalDue - (r.paidAmount||0)), 0);
}
function arrearsBucket(days){
  if(days<=0) return null;
  if(days<=30) return "1–30 days";
  if(days<=60) return "31–60 days";
  if(days<=90) return "61–90 days";
  return "90+ days";
}
function activeLoans(){ return DB.loans.filter(l=> ["Active","Disbursed"].includes(l.status) ); }
function clientName(id){ const c=DB.clients.find(x=>x.id===id); return c?c.name:"—"; }
function staffName(id){ const s=DB.staff.find(x=>x.id===id); if(s) return s.name; if(id && id===session.userId) return session.userName; return "—"; }

function productName(id){ const p=DB.products.find(x=>x.id===id); return p?p.name:"—"; }

function kFmt(n){ return n>=1000000? (n/1000000).toFixed(1)+"M" : n>=1000? (n/1000).toFixed(0)+"K" : Math.round(n); }

/* ---------------- Chart helpers (hand-rolled SVG, no external libs) ---------------- */
const PALETTE = ["#2E5C8A","#B5651D","#2F7D5C","#B4791F","#7A4FA3","#3A8FA8","#C0507A","#5C8A2E","#9C3B3B","#4A5568"];
function polarPoint(cx,cy,r,angleDeg){ const a=(angleDeg)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function donutChart(data, size){
  size = size||170;
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  let angle = -90;
  const r = size/2 - 6, cx = size/2, cy = size/2;
  let paths = "";
  data.forEach(d=>{
    if(d.value<=0) return;
    const frac = d.value/total;
    const start = angle, end = angle + frac*360;
    angle = end;
    const large = (end-start) > 180 ? 1 : 0;
    const [x1,y1] = polarPoint(cx,cy,r,start);
    const [x2,y2] = polarPoint(cx,cy,r,end);
    paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${d.color}" stroke="var(--card)" stroke-width="1.5"></path>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${r*0.56}" fill="var(--card)"></circle></svg>`;
}
function pieLegend(data){
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  return `<div style="display:flex; flex-direction:column; gap:6px;">${data.filter(d=>d.value>0).map(d=>`
    <div style="display:flex; align-items:center; gap:8px; font-size:12px;">
      <span style="width:10px; height:10px; border-radius:3px; background:${d.color}; flex-shrink:0;"></span>
      <span style="flex:1; color:var(--ink-soft);">${escapeHtml(d.label)}</span>
      <span style="font-weight:700; color:var(--navy);">${(d.value/total*100).toFixed(1)}%</span>
    </div>`).join("") || `<div class="empty">No data</div>`}</div>`;
}
function pieCard(title, sub, data, size){
  return `<div class="card">
    <div class="card-title">${title} ${sub?`<small>${sub}</small>`:""}</div>
    <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
      ${donutChart(data, size)}
      <div style="flex:1; min-width:150px;">${pieLegend(data)}</div>
    </div>
  </div>`;
}
function lineChart(points, opts){
  opts = opts||{};
  const w = opts.width||560, h = opts.height||140, pad = 26;
  const max = Math.max(1, ...points.map(p=>p.value));
  const stepX = points.length>1 ? (w-pad*2)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h - pad - (p.value/max)*(h-pad*1.6);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
  const area = path + ` L${coords[coords.length-1][0].toFixed(1)},${h-pad} L${coords[0][0].toFixed(1)},${h-pad} Z`;
  const dots = coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="var(--navy)"><title>${escapeHtml(points[i].label)}: ${fmt(points[i].value)}</title></circle>`).join("");
  const labelEvery = Math.max(1, Math.ceil(points.length/7));
  const labels = points.map((p,i)=> i%labelEvery===0 ? `<text x="${coords[i][0].toFixed(1)}" y="${h-4}" font-size="9" fill="var(--ink-faint)" text-anchor="middle">${escapeHtml(p.label)}</text>` : "").join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="max-width:${w}px;">
    <path d="${area}" fill="rgba(31,56,100,0.08)"></path>
    <path d="${path}" fill="none" stroke="var(--navy)" stroke-width="2"></path>
    ${dots}${labels}
  </svg>`;
}
function progressBar(pct, color){
  pct = Math.max(0, Math.min(100, pct));
  return `<div class="bar-track" style="height:10px;"><div class="bar-fill" style="width:${pct}%; background:${color||'linear-gradient(90deg,var(--navy),var(--navy-soft))'};"></div></div>`;
}

/* ---------------- Actions ---------------- */
// Real backend field names differ slightly from the form's (idNumber ->
// national_id, type -> client_type, branch -> branch_id) — that
// translation happens once, here, so the rest of the client-related UI
// keeps using the same field names it always has (via adaptClient).
async function addClient(data){
  const payload = { name:data.name, phone:data.phone, national_id:data.idNumber||null, email:data.email||null,
    gender:data.gender||null, address:data.address||null, client_type:data.type||'Individual',
    next_of_kin:data.nextOfKin||null, next_of_kin_phone:data.nextOfKinPhone||null, business_type:data.businessType||null };
  if(data.branch) payload.branch_id = data.branch; // restricted roles: server ignores/validates this anyway (resolveWriteBranchId)
  if(data.officerId) payload.officer_id = data.officerId;
  const res = await api.post('/api/clients', payload);
  const c = adaptClient(res.client);
  DB.clients.unshift(c);
  return c;
}
async function updateClient(clientId, data){
  const res = await api.patch(`/api/clients/${clientId}`, data);
  const c = adaptClient(res.client);
  const idx = DB.clients.findIndex(x=>x.id===clientId);
  if(idx>=0) DB.clients[idx] = c; else DB.clients.unshift(c);
  return c;
}
async function addInteraction(clientId, type, note){
  const res = await api.post(`/api/clients/${clientId}/interactions`, { type, note });
  const i = { id:res.interaction.id, clientId, type:res.interaction.type, note:res.interaction.note, staff:session.userName, date:res.interaction.created_at };
  DB.interactions.unshift(i);
  return i;
}
async function addDocument(clientId, name, type, filePath){
  const res = await api.post(`/api/clients/${clientId}/documents`, { name, doc_type: type, file_path: filePath });
  const d = { id:res.document.id, clientId, name:res.document.name, type:res.document.doc_type, filePath:res.document.file_path, date:res.document.created_at };
  DB.documents.unshift(d);
  return d;
}
async function deleteClientDocument(clientId, docId){
  await api.del(`/api/clients/${clientId}/documents/${docId}`);
  DB.documents = DB.documents.filter(d=>d.id!==docId);
}
async function addLead(data){
  const res = await api.post('/api/leads', {
    name:data.name, phone:data.phone, source:data.source||null, notes:data.notes||null,
    national_id:data.national_id||null, address:data.address||null, client_location:data.client_location||null,
    next_of_kin:data.next_of_kin||null, next_of_kin_phone:data.next_of_kin_phone||null, business_type:data.business_type||null,
  });
  const l = { id:res.lead.id, name:res.lead.name, phone:res.lead.phone, source:res.lead.source, status:res.lead.status, notes:res.lead.notes, createdAt:res.lead.created_at };
  DB.leads.unshift(l);
  return l;
}
async function convertLead(leadId){
  const res = await api.post(`/api/leads/${leadId}/convert`, {});
  const c = adaptClient(res.client);
  DB.clients.unshift(c);
  const lead = DB.leads.find(l=>l.id===leadId);
  if(lead) lead.status="Converted";
  toast(`${lead? lead.name : c.name} converted to client`);
  return c;
}

async function createLoanApplication(data){
  const payload = { client_id:data.clientId, product_id:data.productId, principal:Number(data.principal),
    term_months:Number(data.term), purpose:data.purpose||null, guarantor:data.guarantor||null,
    guarantor_contact:data.guarantor_contact||null, loan_securities:data.loan_securities||null,
    loan_category:data.loan_category||null, fee_payer_phone:data.fee_payer_phone||null,
    processing_fee_id:data.processing_fee_id||data.processingFeeId||null,
    branch_id:data.branchId||null, officer_id:data.officerId||null };
  const res = await api.post('/api/loans', payload);
  const loan = adaptLoan(res.loan);
  DB.loans.unshift(loan);
  return loan;
}
// Real 4-step sequential workflow — the status string IS the source of
// truth (comes straight from the backend); this map is only used to
// decide which role's action buttons to show as a UI hint (per
// instruction: "do not merely hide buttons" — the backend re-checks the
// exact same rule server-side on every one of these calls regardless).
const STATUS_TO_REQUIRED_ROLE_ID = {
  "Waiting for Manager":"manager", "Waiting for Regional Manager":"regional_manager",
  "Waiting for Operational Manager":"operational_manager", "Waiting for Accountant":"accountant",
};
async function refreshLoan(loanId){
  const res = await api.get(`/api/loans/${loanId}`);
  res.loan.schedule = res.schedule; // GET /api/loans/:id returns schedule as a sibling field, not nested inside loan
  const loan = adaptLoan(res.loan);
  loan.approvals = res.approvals; loan.workflow = res.workflow;
  loan.postedBy = res.postedBy; loan.templateCreation = res.templateCreation;
  loan.disbursementChannel = res.disbursementChannel;
  const idx = DB.loans.findIndex(x=>x.id===loanId);
  if(idx>=0) DB.loans[idx] = loan; else DB.loans.unshift(loan);
  return loan;
}
async function approveLoan(loanId, comments){
  await api.post(`/api/loans/${loanId}/approve`, { comments: comments||null });
  await refreshLoan(loanId);
  toast("Loan approved — moved to the next step");
}
async function rejectLoan(loanId, reason){
  await api.post(`/api/loans/${loanId}/reject`, { reason: reason||null });
  await refreshLoan(loanId);

function exportCSV(filename, headers, rows){
  const esc = v => { const s=String(v??""); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = [headers.map(esc).join(","), ...rows.map(r=>r.map(esc).join(","))].join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename.endsWith(".csv")?filename:filename+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("CSV exported");
}

/* ---------------- Shared analytics helpers (used by CEO / Director dashboards) ---------------- */
function monthKey(d){ return String(d).slice(0,7); }
function monthlySeries(monthsBack){
  const months = [];
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    months.push({key: d.toISOString().slice(0,7), label: d.toLocaleString('en-KE',{month:'short'})});
  }
  return months.map(m=>{
    const disbursed = DB.loans.filter(l=>l.disbursedAt && monthKey(l.disbursedAt)===m.key).reduce((s,l)=>s+l.principal,0);
    const collections = DB.payments.filter(p=>p.status!=="Unposted" && monthKey(p.date)===m.key).reduce((s,p)=>s+p.amount,0);
    const interestIncome = DB.payments.filter(p=>p.status!=="Unposted" && monthKey(p.date)===m.key).reduce((s,p)=>s+(p.allocated.interest||0),0);
    const expenses = DB.expenses.filter(e=>monthKey(e.date)===m.key).reduce((s,e)=>s+e.amount,0);
    const newClients = new Set(DB.loans.filter(l=>l.disbursedAt && monthKey(l.disbursedAt)===m.key).map(l=>l.clientId)).size;
    return {label:m.label, key:m.key, disbursed, collections, interestIncome, expenses, netProfit: interestIncome-expenses, newClients};
  });
}
function netProfitForMonth(monthKeyStr){
  const interestIncome = DB.payments.filter(p=>p.status!=="Unposted" && monthKey(p.date)===monthKeyStr).reduce((s,p)=>s+(p.allocated.interest||0),0);
  const expenses = DB.expenses.filter(e=>monthKey(e.date)===monthKeyStr).reduce((s,e)=>s+e.amount,0);
  return {interestIncome, expenses, netProfit: interestIncome-expenses};
}
function parAtThreshold(days){
  const scope = activeLoans();
  const outstanding = scope.reduce((s,l)=>s+loanBalance(l),0);
  if(outstanding<=0) return 0;
  const overdue = scope.filter(l=>loanArrearsDays(l)>=days).reduce((s,l)=>s+loanBalance(l),0);
  return overdue/outstanding*100;
}

function investorNotifications(investorId){
  // Same bug family as the dashboard: DB.investors (plural, staff-only) is
  // never populated for a real Investor session. The real record is DB.me.
  const inv = DB.me;
  if(!inv || inv.id !== investorId) return [];
  const payouts = (DB.investorPayouts||[]).filter(p=>p.investorId===investorId).sort((a,b)=> (b.period||"").localeCompare(a.period||""));
  const list = [];
  payouts.forEach(p=>{
    if(!p.period) return;
    const monthName = new Date(p.period+"-01").toLocaleString('en-KE',{month:'long', year:'numeric'});
    if(p.status==="Paid"){
      list.push({id:"inv-ntf-"+p.id, type:"payment", title:"Profit share recorded", message:`Your profit share for ${monthName} has been recorded and paid (${p.reference}).`, date:p.paidAt||p.period+"-28", read:true});
    } else {
      list.push({id:"inv-ntf-"+p.id, type:"system", title:"Monthly statement pending", message:`Your profit statement for ${monthName} is being prepared — company net profit for the month is still being finalized.`, date:p.period+"-01", read:false});
    }
  });
  const maturity = addMonths(inv.startDate, inv.termMonths);
  const daysToMaturity = daysBetween(todayISO(), maturity);
  if(daysToMaturity>=0 && daysToMaturity<=30){
    list.unshift({id:"inv-ntf-maturity", type:"system", title:"Investment nearing maturity", message:`Your investment reaches maturity in ${daysToMaturity} day(s), on ${maturity}.`, date:new Date().toISOString(), read:false});
  } else if(daysToMaturity<0){
    list.unshift({id:"inv-ntf-matured", type:"system", title:"Investment matured", message:`Your investment reached maturity on ${maturity}.`, date:new Date().toISOString(), read:false});
  }
  return list.sort((a,b)=> new Date(b.date)-new Date(a.date));
}

// ==================== Chart.js lifecycle helpers ====================
// renderApp() replaces the whole DOM via innerHTML on every state change,
// so any Chart.js instance from the previous render is orphaned — Chart.js
// keeps its own internal registry and will throw "Canvas is already in
// use" if a new chart is created on a canvas id it still thinks is live.
// Report-rendering functions call registerChart(id, spec) while building
// their HTML string (before the canvas exists in the real DOM yet);
// initPendingCharts() runs once, after root.innerHTML is actually set,
// destroys any stale instance for that id, and creates the real one.
window.__pendingCharts = [];
window.__chartInstances = {};
function registerChart(id, config){ window.__pendingCharts.push({ id, config }); return `<div style="position:relative; height:260px; margin-top:10px;"><canvas id="${id}" role="img" aria-label="Chart"></canvas></div>`; }
function initPendingCharts(){
  const pending = window.__pendingCharts; window.__pendingCharts = [];
  pending.forEach(({id, config})=>{
    const canvas = document.getElementById(id);
    if(!canvas) return;
    if(window.__chartInstances[id]){ window.__chartInstances[id].destroy(); delete window.__chartInstances[id]; }
    try{ window.__chartInstances[id] = new Chart(canvas, config); }catch(e){ console.error('Chart init failed', id, e); }
  });
}

function openForgotPassword(){
  forgotPasswordState = { submitting:false, submitted:false, error:"" };
  forgotPasswordOpen = true;
  renderApp();
}
function closeForgotPassword(){
  forgotPasswordOpen = false;
  forgotPasswordState = { submitting:false, submitted:false, error:"" };
  renderApp();
}
async function doForgotPassword(ev){
  ev.preventDefault();
  if(forgotPasswordState.submitting || forgotPasswordState.submitted) return false;
  const f = Object.fromEntries(new FormData(ev.target));
  if(!f.email){ forgotPasswordState.error = "Please enter your email address."; renderApp(); return false; }
  forgotPasswordState.error = "";
  forgotPasswordState.submitting = true;
  renderApp();
  try{
    const result = await api.post('/api/auth/forgot-password', { email: f.email });
    forgotPasswordState.submitting = false;
    forgotPasswordState.submitted = true;
    forgotPasswordState.message = result.message;
  }catch(e){
    forgotPasswordState.submitting = false;
    forgotPasswordState.error = e.message || "Something went wrong. Please try again.";
  }
  renderApp();
  return false;
}

// Real authentication — staff accounts and investor accounts use two
// structurally separate backend endpoints (see docs/RBAC.md: investors are
// not a role, they're a different principal type entirely), so a login
// attempt tries staff first and falls back to the investor endpoint only
// if that fails. Nothing here guesses a role or fabricates a session —
// both branches only ever succeed with a real 200 from the backend.
let sessionWarningTimer = null;
// Real warning before expiration — only possible because expiresAt now
// comes from the real session row the backend already maintains (see
// auth.js /login and /me). Never a fabricated inactivity timer: this
// fires based on the actual real expiry timestamp, 5 real minutes before it.
// Real, cross-tab session-security channel — when this tab logs out or
// detects a genuinely revoked/expired session, it broadcasts that fact so
// OTHER real tabs react immediately, rather than waiting for their own
// next API call to eventually fail with a 401. Not a second auth
// mechanism: every tab still independently verifies against the real
// backend the next time it makes a request — this channel only makes
// that discovery proactive instead of reactive. Falls back to doing
// nothing where BroadcastChannel isn't available (still fully correct,
// just reactive-only, exactly as before).
const sessionChannel = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('rhinocash-session') : null;
if(sessionChannel){
  sessionChannel.onmessage = (ev)=>{
    if(ev.data === 'session-ended' && session.loggedIn){
      authToken = null; session.loggedIn = false; session.section = "dashboard";
      DB = null; session.justLoggedOut = false;
      if(sessionWarningTimer){ clearTimeout(sessionWarningTimer); sessionWarningTimer = null; }
      openModal('session-expired');
    }
  };
}
function broadcastSessionEnded(){ if(sessionChannel) sessionChannel.postMessage('session-ended'); }

function scheduleSessionExpiryWarning(){
  if(sessionWarningTimer){ clearTimeout(sessionWarningTimer); sessionWarningTimer = null; }
  if(!session.sessionExpiresAt) return;
  // Real, Admin-configurable lead time (System Administration → Security
  // Settings) — defaults to 5 minutes but is never a hardcoded constant.
  const warningMinutes = session.sessionWarningMinutes || 5;
  const msUntilWarning = new Date(session.sessionExpiresAt).getTime() - Date.now() - (warningMinutes*60*1000);
  if(msUntilWarning <= 0) return; // already within the warning window or past it — skip rather than fire immediately on load
  sessionWarningTimer = setTimeout(()=>{
    if(session.loggedIn && !modal) openModal('session-expiry-warning');
  }, msUntilWarning);
}
function renderSessionExpiryWarningModal(){
  return `
    <div class="modal-head"><h3>Your session is about to expire</h3></div>
    <div class="hint" style="margin-bottom:16px;">You will be signed out soon due to your security session timeout.</div>
    <div class="pill-row">
      <button class="btn btn-primary btn-sm" onclick="closeModal()">Stay Signed In</button>
      <button class="btn btn-outline btn-sm" onclick="confirmLogout()">Sign Out</button>
    </div>
  `;
}
async function doLogin(ev){
  ev.preventDefault();
  if(session.loggingIn || session.loginSuccess) return false; // duplicate-submit guard
  const f = Object.fromEntries(new FormData(ev.target));
  if(!f.username || !f.password){ loginError = "Please enter your email and password."; renderApp(); return false; }
  loginError = "";
  session.loggingIn = true;
  renderApp();
  try{
    let result, isInvestor = false;
    try{
      result = await apiRequest('POST', '/api/auth/login', { email: f.username, password: f.password });
    }catch(staffErr){
      if(staffErr.status === 429){ throw staffErr; } // real lockout — don't mask it by trying the investor path
      result = await apiRequest('POST', '/api/investor-auth/login', { email: f.username, password: f.password });
      isInvestor = true;
    }
    authToken = result.token;
    if(isInvestor){
      session.role = "Investor";
      session.userName = result.investor.name;
      session.investorId = result.investor.id;
      session.userId = null;
      session.mustChangePassword = false;
    } else {
      session.role = ROLE_ID_TO_DISPLAY[result.user.role_id] || result.user.role_id;
      session.userName = result.user.name;
      session.userId = result.user.id;
      session.investorId = null;
      session.mustChangePassword = !!result.mustChangePassword;
    }
    session.section = "dashboard";
    session.sidebarExpanded = {};
    session.sessionExpiresAt = result.expiresAt || null;
    session.sessionWarningMinutes = result.sessionWarningMinutes || 5;
    scheduleSessionExpiryWarning();
    // Credentials are verified and the session is real at this point — say
    // so immediately instead of leaving the user staring at a static
    // screen while loadCoreData() (which can take a few seconds on a slow
    // connection) runs. loadCoreData() populates DB itself, so it's safe to
    // kick it off in the background while still showing the login panel;
    // this also skips the separate full-page "Loading your data…" screen
    // that used to appear right after this one, since this message already
    // covers that wait.
    session.loggingIn = false;
    session.loginSuccess = true;
    renderApp();
    await loadCoreData();
    session.loggedIn = true;
    session.loginSuccess = false;
    renderApp();
  }catch(e){
    session.loggingIn = false;
    session.loginSuccess = false;
    loginError = (e && e.message) || "Invalid credentials.";
    renderApp();
  }
  return false;
}

// Logout is a security action: never fire immediately on click. Opens a
// real confirmation modal; the actual session-ending work happens in
// confirmLogout() below, only once the user explicitly confirms.
function promptLogout(){ openModal('confirm-logout'); }
async function confirmLogout(){
  session.loggingOut = true; renderApp();
  const isInvestor = session.role === 'Investor';
  try{
    if(authToken){
      // Investors are a structurally separate principal type (see
      // requireInvestorAuth on the backend) — they were never able to use
      // the staff-only /api/auth/logout at all, so calling the wrong
      // endpoint here would silently fail and leave their real session
      // valid server-side even after "logging out" client-side.
      await apiRequest('POST', isInvestor ? '/api/investor-auth/logout' : '/api/auth/logout');
    }
  }catch(e){
    // Logout is a security action: even if the server can't be reached,
    // the user must not be left stuck in an authenticated-looking UI.
    // The real session row may still be technically valid until it
    // naturally expires, but the client stops using it immediately below.
  }
  authToken = null;
  session.loggedIn = false; session.loggingOut = false;
  if(sessionWarningTimer){ clearTimeout(sessionWarningTimer); sessionWarningTimer = null; }
  broadcastSessionEnded();
  session.userId = null; session.investorId = null;
  session.selectedClientId = null; session.selectedLoanId = null; session.selectedStaffId = null;
  session.role = "Admin"; session.userName = ""; session.section = "dashboard"; session.subtab = null;
  DB = null; modal = null;
  session.justLoggedOut = true;
  renderApp();
  setTimeout(()=>{ session.justLoggedOut = false; renderApp(); }, 4000);
}
function doLogout(){ promptLogout(); }

/* ---------- 1. Dashboard ---------- */
function computeStats(officerId, branchIds){
  let clientsScope = officerId
    ? DB.clients.filter(c => DB.loans.some(l=>l.clientId===c.id && l.officerId===officerId))
    : DB.clients;
  let loansScope = officerId ? DB.loans.filter(l=>l.officerId===officerId) : DB.loans;
  if(branchIds && branchIds.length){
    loansScope = loansScope.filter(l=>branchIds.includes(l.branchId));
    clientsScope = clientsScope.filter(c=>branchIds.includes(c.branch));
  }
  const activeScope = loansScope.filter(l=>["Active","Disbursed"].includes(l.status));

  const disbursedMTD = loansScope.filter(l=>l.disbursedAt && isThisMonth(l.disbursedAt)).reduce((s,l)=>s+l.principal,0);
  const loansMTDCount = loansScope.filter(l=>l.disbursedAt && isThisMonth(l.disbursedAt)).length;
  const ytdStart = new Date(new Date().getFullYear(),0,1);
  const disbursedYTD = loansScope.filter(l=>l.disbursedAt && new Date(l.disbursedAt)>=ytdStart).reduce((s,l)=>s+l.principal,0);
  const loansYTDCount = loansScope.filter(l=>l.disbursedAt && new Date(l.disbursedAt)>=ytdStart).length;

  const paymentsScope = officerId
    ? DB.payments.filter(p=>{ const l=DB.loans.find(x=>x.id===p.loanId); return l && l.officerId===officerId; })
    : (branchIds && branchIds.length
        ? DB.payments.filter(p=>{ const l=DB.loans.find(x=>x.id===p.loanId); return l && branchIds.includes(l.branchId); })
        : DB.payments);
  const collectionsMTD = paymentsScope.filter(p=>p.status!=="Unposted" && isThisMonth(p.date)).reduce((s,p)=>s+p.amount,0);
  const interestIncomeMTD = paymentsScope.filter(p=>p.status!=="Unposted" && isThisMonth(p.date)).reduce((s,p)=>s+(p.allocated.interest||0),0);
  const dueMTD = activeScope.flatMap(l=>l.schedule).filter(r=>r.dueDate && isThisMonth(r.dueDate)).reduce((s,r)=>s+r.totalDue,0);
  const otcPct = dueMTD>0 ? Math.min(150, collectionsMTD/dueMTD*100) : 100;

  const prevMonthDate = new Date(); prevMonthDate.setMonth(prevMonthDate.getMonth()-1);
  const isPrevMonth = d => { const x=new Date(d); return x.getFullYear()===prevMonthDate.getFullYear() && x.getMonth()===prevMonthDate.getMonth(); };
  const collectionsPrev = paymentsScope.filter(p=>p.status!=="Unposted" && isPrevMonth(p.date)).reduce((s,p)=>s+p.amount,0);
  const duePrev = activeScope.flatMap(l=>l.schedule).filter(r=>r.dueDate && isPrevMonth(r.dueDate)).reduce((s,r)=>s+r.totalDue,0);
  const collPctPrev = duePrev>0 ? Math.min(150, collectionsPrev/duePrev*100) : 100;

  const undisbursed = loansScope.filter(isUndisbursedLoan);
  const undisbursedAmt = undisbursed.reduce((s,l)=>s+l.principal,0);

  const totalClients = clientsScope.length;
  const activeClientIds = new Set(activeScope.map(l=>l.clientId));
  const activeClients = activeClientIds.size;
  const dormantClients = Math.max(0, totalClients - activeClients);

  const performingLoans = activeScope.filter(l=>loanArrearsDays(l)===0).length;
  const arrearsLoans = activeScope.filter(l=>loanArrearsDays(l)>0);
  const arrearsAmt = arrearsLoans.reduce((s,l)=>s+loanBalance(l),0);
  const portfolioOutstanding = activeScope.reduce((s,l)=>s+loanBalance(l),0);
  const par = portfolioOutstanding>0 ? arrearsAmt/portfolioOutstanding*100 : 0;

  const loansThisMonth = loansScope.filter(l=>l.disbursedAt && isThisMonth(l.disbursedAt));
  let newLoans=0, repeatLoans=0;
  loansThisMonth.forEach(l=>{
    const priorLoans = DB.loans.filter(x=>x.clientId===l.clientId && x.disbursedAt && x.disbursedAt < l.disbursedAt);
    if(priorLoans.length===0) newLoans++; else repeatLoans++;
  });

  const today = todayISO();
  const dueToday = activeScope.flatMap(l=>l.schedule).filter(r=>r.dueDate===today).reduce((s,r)=>s+r.totalDue,0);
  const collectedToday = paymentsScope.filter(p=>p.status!=="Unposted" && p.date.slice(0,10)===today).reduce((s,p)=>s+p.amount,0);
  const todayPct = dueToday>0 ? Math.min(100, collectedToday/dueToday*100) : 0;

  const monthStart = todayISO().slice(0,8)+"01";
  const arrearsOpen = activeScope.reduce((sum,l)=> sum + (l.schedule||[]).filter(r=>r.dueDate && r.dueDate<monthStart && r.status!=="Paid").reduce((s,r)=>s+Math.max(0,r.totalDue-(r.paidAmount||0)),0), 0);

  return {clientsScope, loansScope, activeScope, disbursedMTD, loansMTDCount, disbursedYTD, loansYTDCount,
    collectionsMTD, interestIncomeMTD, otcPct, collectionsPrev, collPctPrev, undisbursedCount:undisbursed.length, undisbursedAmt,
    totalClients, activeClients, dormantClients, performingLoans, arrearsAmt, arrearsOpen, par, portfolioOutstanding,
    newLoans, repeatLoans, dueToday, collectedToday, todayPct};
}
/* Builds the full per-officer indicator matrix: New Loans / Repeat Loans / Arrears / Performing / Revenue,
   each with Target, Actual, Score(%), and a rank Position among officers — plus an overall Avg score
   (mean of the five category scores) used for the Performance table and dashboard rankings. */
function currentPeriodKey(){ return new Date().toISOString().slice(0,7); } // 'YYYY-MM', matches the backend's monthly period convention
function findTarget(recipientUserId, metric, period){
  return (DB.targets||[]).find(t=>t.recipientUserId===recipientUserId && t.metric===metric && t.period===period && t.status==="Active");
}
function buildIndicatorMatrix(branchIds){
  const period = currentPeriodKey();
  let officers = DB.staff.filter(s=>s.role==="Loan Officer" && (!branchIds || branchIds.includes(s.branch)));
  // A Loan Officer viewing their OWN dashboard never has DB.staff populated
  // at all (they correctly hold no 'staff' module access — managing a
  // team isn't their job) — but this exact table is also their own
  // dashboard's Performance Indicators section, so they must still see
  // their own row. Falls back to synthesizing it from DB.me (their real
  // own record) only when DB.staff doesn't already have it.
  if(officers.length===0 && DB.me && DB.me.role_id==="loan_officer"){
    officers = [adaptStaff(DB.me)];
  }
  const rows = officers.map(o=>{
    const st = computeStats(o.id);
    // Real target takes priority the moment a Manager has set one for this
    // officer/metric/period; the existing derived defaults (the fields
    // this table always used) remain the fallback — nothing that already
    // worked stops working just because no one has set a real target yet.
    const newLoansTarget = findTarget(o.id, "new_loans", period);
    const newTarget = newLoansTarget ? newLoansTarget.value : (o.newLoanTarget || 10);
    const newActual = st.newLoans;
    const newScore = newTarget>0 ? newActual/newTarget*100 : 0;

    const repeatTarget = Math.max(1, Math.round(newTarget*1.5));
    const repeatActual = st.repeatLoans;
    const repeatScore = repeatTarget>0 ? repeatActual/repeatTarget*100 : 0;

    const arrearsOpen = st.arrearsOpen;
    const arrearsNow = st.arrearsAmt;
    const arrearsScore = st.portfolioOutstanding>0 ? -(arrearsNow-arrearsOpen)/st.portfolioOutstanding*100 : 0;

    const performingTarget = Math.max(5, Math.round(st.activeScope.length*0.8));
    const performingActual = st.performingLoans;
    const performingScore = performingTarget>0 ? performingActual/performingTarget*100 : 0;

    const disbursementTarget = findTarget(o.id, "disbursement", period);
    const revenueTarget = disbursementTarget ? Math.max(1, Math.round(disbursementTarget.value*0.25)) : Math.max(10000, Math.round((o.target||500000)*0.25));
    const revenueActual = st.interestIncomeMTD;
    const revenueScore = revenueTarget>0 ? revenueActual/revenueTarget*100 : 0;

    const avgScore = (newScore+repeatScore+arrearsScore+performingScore+revenueScore)/5;

    return {officer:o, stats:st,
      newTarget, newActual, newScore, newTargetIsReal: !!newLoansTarget,
      repeatTarget, repeatActual, repeatScore,
      arrearsOpen, arrearsNow, arrearsScore,
      performingTarget, performingActual, performingScore,
      revenueTarget, revenueActual, revenueScore, revenueTargetIsReal: !!disbursementTarget,
      avgScore};
  });
  ["newScore","repeatScore","arrearsScore","performingScore","revenueScore","avgScore"].forEach(key=>{
    const sorted = [...rows].sort((a,b)=>b[key]-a[key]);
    sorted.forEach((r,i)=>{ r[key+"Pos"] = i+1; });
  });
  rows.sort((a,b)=>b.avgScore-a.avgScore);
  return rows;
}
function rankedOfficerScores(branchIds){
  return buildIndicatorMatrix(branchIds).map(r=>({officer:r.officer, stats:r.stats, score:r.avgScore}));
}

function clientBracketPie(loansScope){
  const bands = [
    {label:"Under 25K", min:0, max:25000},
    {label:"25K – 50K", min:25000, max:50000},
    {label:"50K – 100K", min:50000, max:100000},
    {label:"100K – 200K", min:100000, max:200000},
    {label:"200K & above", min:200000, max:Infinity},
  ];
  const counts = bands.map(()=>0);
  loansScope.forEach(l=>{
    const idx = bands.findIndex(b=> l.principal>=b.min && l.principal<b.max);
    if(idx>=0) counts[idx]++;
  });
  return bands.map((b,i)=>({label:b.label, value:counts[i], color:PALETTE[i%PALETTE.length]}));
}
function loanCyclePie(clientsScope){
  const buckets = {"1 Cycle":0,"2 Cycles":0,"3 Cycles":0,"4 Cycles":0,"5+ Cycles":0};
  clientsScope.forEach(c=>{
    const n = DB.loans.filter(l=>l.clientId===c.id && l.disbursedAt).length;
    if(n<=0) return;
    if(n===1) buckets["1 Cycle"]++;
    else if(n===2) buckets["2 Cycles"]++;
    else if(n===3) buckets["3 Cycles"]++;
    else if(n===4) buckets["4 Cycles"]++;
    else buckets["5+ Cycles"]++;
  });
  return Object.entries(buckets).map(([label,value],i)=>({label, value, color:PALETTE[i%PALETTE.length]}));
}
function productPieData(loansScope){
  const active = loansScope.filter(l=>["Active","Disbursed"].includes(l.status));
  const byProduct = {};
  active.forEach(l=>{ byProduct[l.productName] = (byProduct[l.productName]||0) + loanBalance(l); });
  return Object.entries(byProduct).map(([label,value],i)=>({label, value, color:PALETTE[i%PALETTE.length]}));
}
function olbByOfficerPieData(){
  return DB.staff.filter(s=>s.role==="Loan Officer").map((o,i)=>{
    const bal = activeLoans().filter(l=>l.officerId===o.id).reduce((s,l)=>s+loanBalance(l),0);
    return {label:o.name, value:bal, color:PALETTE[i%PALETTE.length]};
  });
}
function disbursementTrendPoints(loansScope){
  const now = new Date();
  const daysInMonth = now.getDate();
  const byDay = {};
  loansScope.forEach(l=>{
    if(l.disbursedAt && isThisMonth(l.disbursedAt)){
      const d = new Date(l.disbursedAt).getDate();
      byDay[d] = (byDay[d]||0) + l.principal;
    }
  });
  const points = [];
  for(let d=1; d<=daysInMonth; d++) points.push({label:String(d), value: byDay[d]||0});
  return points;
}

function branchPerformanceBars(branchIds){
  const branches = branchIds ? DB.branches.filter(b=>branchIds.includes(b.id)) : DB.branches;
  const branchPerf = branches.map(b=>{
    const bl = activeLoans().filter(l=>l.branchId===b.id);
    const bal = bl.reduce((s,l)=>s+loanBalance(l),0);
    const parB = bal>0 ? bl.filter(l=>loanArrearsDays(l)>0).reduce((s,l)=>s+loanBalance(l),0)/bal*100 : 0;
    return {name:b.name, loans:bl.length, portfolio:bal, par:parB};
  }).sort((a,b)=>b.portfolio-a.portfolio);
  const maxBranch = Math.max(1,...branchPerf.map(b=>b.portfolio));
  return `<div class="card">
    <div class="card-title">Branch Performance <small>outstanding portfolio &amp; PAR by branch</small></div>
    ${branchPerf.map(b=>`
      <div class="bar-row"><div class="bar-label">${b.name}</div>
        <div class="bar-track"><div class="bar-fill rust" style="width:${(b.portfolio/maxBranch*100).toFixed(0)}%"></div></div>
        <div class="bar-val">${kFmt(b.portfolio)}</div>
        <span class="badge ${b.par>10?'red':(b.par>5?'amber':'green')}" style="margin-left:8px;">${b.par.toFixed(1)}% PAR</span></div>
    `).join("") || `<div class="empty">No branches in scope.</div>`}
  </div>`;
}
// Real loan-status distribution — used by role dashboards that want to see
// how their portfolio is spread across the actual workflow stages, not a
// single "Active vs not" split.
function loanStatusPie(loansScope){
  const counts = {};
  loansScope.forEach(l=>{ counts[l.status] = (counts[l.status]||0) + 1; });
  const colors = { "Active":"#2E7D32", "Disbursed":"#2E7D32", "Completed":"#78909C", "Rejected":"#C62828",
    "Returned for Correction":"#EF6C00", "Written Off":"#B71C1C", "Restructured":"#1565C0", "Approved for Disbursement":"#1565C0" };
  return Object.entries(counts).map(([label,value])=>({label, value, color: colors[label] || (label.startsWith("Waiting") ? "#F9A825" : "#90A4AE")}));
}
